repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=500"]
        exclude: ^data/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-ungated-mocks-in-src
        name: Reject unittest.mock usage in src/ (workspace CLAUDE.md)
        entry: bash -c 'if grep -rn --include="*.py" --exclude-dir="*.egg-info" "from unittest.mock\|from unittest import mock\|^import mock\|MagicMock" src/ 2>/dev/null; then echo "Found mocks in src/ — workspace policy forbids."; exit 1; fi'
        language: system
        pass_filenames: false

      # TX5 AC2 — every top-level import in src/ must resolve.
      # Uses .venv/bin/python explicitly: plain ``python`` picks up
      # whichever interpreter is first on PATH, which may not have the
      # editable installs (apecx_db_integration, psycopg, etc.) and
      # flags false-positive "unresolvable" imports. Assumes the venv
      # lives at .venv/ in the repo root — if yours lives elsewhere,
      # adjust.
      - id: imports-resolve
        name: All src/ imports resolve (TX5 AC2)
        entry: .venv/bin/python scripts/checks/imports_resolve.py src/
        language: system
        pass_filenames: false

      # TX5 AC3 — nanobrain step-authoring compliance.
      - id: step-authoring-compliance
        name: Step subclasses implement process(), don't override execute() (TX5 AC3)
        entry: .venv/bin/python scripts/checks/step_authoring.py src/
        language: system
        pass_filenames: false

      # G39 — workflow YAMLs declare config_version: 2 and every
      # DirectLink has explicit auto_transfer: true. The dominant
      # silent-failure shape (auto_transfer=False default) is the
      # whole reason this lint exists.
      - id: workflow-yaml-lint
        name: Workflow YAMLs are v2 + every DirectLink has auto_transfer (G39)
        entry: .venv/bin/python scripts/lint_workflow_yamls.py --quiet
        language: system
        pass_filenames: false

      # Hard review gate (commit-msg stage): BLOCKS a non-trivial commit whose
      # message has no `Reviewed:` trailer recording the self-review (necessity /
      # minimality / readability / DRY / what-was-deleted). The shared script lives
      # at the WORKSPACE level next to review_policy_check.py (which it reuses); the
      # `../` resolves from both this repo checkout and any wt-* worktree (siblings of
      # .claude/). INSTALL the stage once: `pre-commit install --hook-type commit-msg`.
      - id: review-gate
        name: "Non-trivial commits carry a Reviewed: trailer (review gate)"
        entry: .venv/bin/python ../.claude/scripts/review_gate.py
        language: system
        stages: [commit-msg]
        always_run: true
        # MUST be true for commit-msg stage: pre-commit passes the commit-message
        # file path AS the filename. With pass_filenames:false the script gets no
        # argv[1] and silently no-ops (verified — the gate then never blocks).
