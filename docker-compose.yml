# T09 AC7: Postgres service for the Control Plane.
#
# Default usage (persistent data survives restarts):
#   docker compose up -d postgres
#   export APECX_CP_POSTGRES_URL="postgresql+psycopg://apecx:apecx@localhost:5433/apecx_cp"
#
# CI / ephemeral usage (tmpfs, zero-state between runs):
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d postgres
# The override file replaces the named volume with tmpfs so every CI
# job starts with a blank DB and nothing survives container restart.
#
# Port 5433 (not 5432) to avoid colliding with a locally-installed
# Postgres. pg_isready healthcheck so tests wait for readiness without
# sleeping.

services:
  postgres:
    image: postgres:16-alpine
    container_name: apecx-cp-postgres
    environment:
      POSTGRES_USER: apecx
      POSTGRES_PASSWORD: apecx
      POSTGRES_DB: apecx_cp
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apecx -d apecx_cp"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - apecx_cp_postgres_data:/var/lib/postgresql/data

volumes:
  apecx_cp_postgres_data:
