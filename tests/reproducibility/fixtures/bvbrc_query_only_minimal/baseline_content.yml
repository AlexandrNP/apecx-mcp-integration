name: bvbrc_query_only_minimal
description: "Extract virus names and look them up against the BV-BRC local snapshot."
version: "0.1.0"
steps:
  extract:
    class: "apecx_integration.composition.steps.db_integration_wrappers.EntityExtractionStep"
    config: "steps/entity_extraction.yml"
  snapshot_match:
    class: "nanobrain.library.workflows.viral_protein_analysis.steps.enhanced_bv_brc_data_acquisition_step.EnhancedBVBRCDataAcquisitionStep"
    config: "steps/bvbrc_snapshot_match.yml"
links:
  extract_to_match:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: "extract.entity_candidates_output"
      target: "snapshot_match.entity_candidates_input"