# Workflow spec final step — rag_synthesis
#
# Free-form Markdown synthesis with inline citations from the four
# upstream data sources: BV-BRC genomes, VIOLIN cached mappings, RAG
# semantic chunks, and DataCite-shaped harvester publications.
#
# Wraps ``apecx_integration.agents.rag_synthesis.synthesize_response``
# via ``RagSynthesisStep`` (see
# ``src/apecx_integration/composition/steps/rag_synthesis_step.py``).
#
# LLM backend resolved from APECX_LLM_BASE_URL / APECX_LLM_MODEL /
# APECX_LLM_API_KEY env vars (default: local Ollama at
# http://localhost:11434/v1 with mistral-nemo:latest). No API key
# required for local-LLM deployments.

class: "apecx_integration.composition.steps.rag_synthesis_step.RagSynthesisStep"
name: rag_synthesis
description: >
  Final synthesis — assemble retrieved BV-BRC genomes + VIOLIN
  mappings + RAG chunks + DataCite publications into a Markdown
  response with inline citations grounded in the input data.

# Optional override; defaults to the bundled
# apecx_integration/agents/rag_synthesis/synthesis_config.yml when
# unset (recommended for first-release deployments).
# synthesis_config_path: "/path/to/custom_synthesis_config.yml"

input_data_units:
  synthesis_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: synthesis_input
    description: >
      Aggregated dict with the scientist query and the four retrieval
      bundles: ``{query: str, rag_chunks: list, bvbrc_genomes: list,
      violin_mappings: list, publications: list}``. Upstream steps
      (or a TransformLink) assemble this shape.
    persistent: false

output_data_units:
  synthesis_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: synthesis_output
    description: >
      ``{synthesis: str}`` — Markdown response with inline citations
      validated by the synthesizer's gates (size + grounded).
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "synthesis_input"
