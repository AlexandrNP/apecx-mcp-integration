# apecx-mcp edge — the ONLY externally-reachable surface for the (deliberately unauthenticated)
# MCP endpoint. Forwards ONLY /mcp to the loopback-bound apecx-mcp (127.0.0.1:8001) and imposes the
# abuse controls that substitute for the absent authentication: TLS, body-size cap, per-source-IP
# rate + concurrency limits, timeouts, and access logging. Install into nginx's http{} context,
# e.g. /etc/nginx/conf.d/apecx-mcp.conf. See deploy/nginx/README.md for the mode switch + caveats.
#
# TWO INGRESS MODES — enable exactly one server{} below (both is fine; they use different ports):
#   A. Behind a TLS-terminating tunnel (cloudflared/ngrok): the tunnel terminates public TLS and
#      forwards to the LOCAL plain-http listener; the real-ip block makes per-IP limits key on the
#      TRUE client, not the tunnel. (Mode B's server{} is commented out.)
#   B. Direct :443 (public IP + DNS + your cert): nginx terminates TLS itself. (Default-enabled.)

# --- Abuse-control zones + log format (http context) -------------------------------------
# Per-source-IP request rate: 5 r/s sustained, burst 10 (tune from real traffic — audit Phase L4).
limit_req_zone  $binary_remote_addr  zone=apecx_mcp_rate:10m  rate=5r/s;
# Per-source-IP concurrent connections — MCP streamable-http/SSE responses are long-lived, so cap
# how many streams one caller can hold open.
limit_conn_zone $binary_remote_addr  zone=apecx_mcp_conn:10m;
# Global concurrency ceiling (all callers share this key). A per-IP cap alone lets a many-IP
# botnet exhaust connections; this bounds total in-flight streams across everyone.
limit_conn_zone $server_name         zone=apecx_mcp_global:1m;

# Don't leak the nginx version in the Server header / default error pages.
server_tokens off;

# Access log WITHOUT request body. The JSON-RPC body carries uuid4 data_handles (capability tokens
# — possession == access); $request logs only the request LINE ("POST /mcp HTTP/1.1"), never the
# body. NEVER add $request_body here, and treat the log file as a secret (mode-600, see README).
log_format apecx_mcp '$remote_addr $time_iso8601 "$request" $status $body_bytes_sent '
                     'rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time"';

# --- Reusable proxy settings (one definition, included into the active location) ---------
# Defined once to avoid drift between the two ingress modes (DRY).
# To use: `include /etc/nginx/conf.d/apecx-mcp.proxy.inc;` — but to keep this a single self-contained
# file, the directives are inlined in each location below instead.

# ===== MODE B (default): direct :443 — public IP + DNS + cert ============================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;   # set to your FQDN

    # TLS — modern protocols/ciphers only.
    ssl_certificate     /etc/nginx/tls/apecx-mcp.crt;   # operator-provided (e.g. certbot/Let's Encrypt)
    ssl_certificate_key /etc/nginx/tls/apecx-mcp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:apecx_ssl:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;   # force HTTPS on revisit

    access_log /var/log/nginx/apecx-mcp.access.log apecx_mcp;
    error_log  /var/log/nginx/apecx-mcp.error.log warn;

    client_max_body_size  2m;     # cap tool-argument payloads (tune from audit Phase L4)
    client_header_timeout 15s;
    client_body_timeout   30s;

    # The surface is EXACTLY one path. Everything else is 404 (no directory listing, no other proxy).
    location /mcp {
        limit_req  zone=apecx_mcp_rate burst=10 nodelay;   # rate-limit per source IP
        limit_conn apecx_mcp_conn 8;                       # concurrent streams per source IP
        limit_conn apecx_mcp_global 256;                   # global concurrency ceiling (all IPs)

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header Connection "";        # upstream keepalive (streamable-http)
        proxy_buffering  off;                  # stream MCP/SSE responses to the client
        proxy_read_timeout 600s;               # bound a long tool call (matches the tool ceilings)
        proxy_send_timeout 60s;
    }
    location / { return 404; }
}

# ===== HTTP -> HTTPS redirect (mode B only) =============================================
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

