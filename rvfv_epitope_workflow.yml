name: rift_valley_fever_epitope_search
description: Retrieve and synthesize information about conserved neutralizing epitopes
  on Rift Valley Fever Virus glycoprotein Gn.
version: 0.1.0
config_version: 2
steps:
  rag_search:
    class: apecx_integration.composition.steps.domain_rag_step.DomainRagSearchStep
    config: steps/domain_rag_search.yml
  context_lookup:
    class: apecx_integration.composition.steps.violin_bvbrc_context_step.VIOLINBVBRCContextStep
    config: steps/violin_bvbrc_context.yml
  synthesis:
    class: apecx_integration.composition.steps.rag_synthesis_step.RagSynthesisStep
    config: steps/rag_synthesis.yml
links:
  workflow_input_to_rag_search_rag_query_input_0:
    class: nanobrain.core.link.DirectLink
    config:
      link_type: direct
      source: workflow_input
      target: rag_search.rag_query_input
      auto_transfer: true
  rag_search_rag_chunks_output_to_context_lookup_context_query_input_1:
    class: nanobrain.core.link.DirectLink
    config:
      link_type: direct
      source: rag_search.rag_chunks_output
      target: context_lookup.context_query_input
      auto_transfer: true
  context_lookup_context_output_to_synthesis_synthesis_input_2:
    class: nanobrain.core.link.DirectLink
    config:
      link_type: direct
      source: context_lookup.context_output
      target: synthesis.synthesis_input
      auto_transfer: true
  synthesis_synthesis_output_to_workflow_output_3:
    class: nanobrain.core.link.DirectLink
    config:
      link_type: direct
      source: synthesis.synthesis_output
      target: workflow_output
      auto_transfer: true
input_data_units:
  workflow_input:
    class: nanobrain.core.data_unit.DataUnitMemory
    name: workflow_input
    persistent: false
output_data_units:
  workflow_output:
    class: nanobrain.core.data_unit.DataUnitMemory
    name: workflow_output
    persistent: false
