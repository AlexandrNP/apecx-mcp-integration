# mcp_workflow_catalog.yml — packaged default catalog of pre-made
# nanobrain workflows exposed as MCP tools.
#
# Loaded at server startup by `apecx_integration.mcp_surface.server`
# via `workflow_registry.load_catalog(...)`. Override via the
# APECX_MCP_WORKFLOW_CATALOG environment variable.
#
# Schema: src/apecx_integration/mcp_surface/workflow_registry.py
#   (Pydantic, extra='forbid' — typos rejected, never silently used)
#
# To add a new pre-made workflow, append an entry here. See
# docs/running_nanobrain_workflows_via_mcp.md for the full guide.

# promote_discovered — names of DISCOVERED workflows to ALSO expose as first-class MCP
# tools at startup, WITHOUT a full `workflows:` entry. Each gets a typed {query} tool so a
# model calls it directly (no list_workflows hop — small models skip that). Add a name here
# to promote a query-shaped product workflow; use a full `workflows:` entry for ones that
# need richer typed params (taxon_id, protein). Names also in `workflows:` are ignored.
promote_discovered:
  - rag_e2e_synthesis

workflows:
  - tool_name: rhea_muscle_alignment
    description: |
      Align FASTA sequences using MUSCLE via Rhea over MCP. Returns the
      alignment FASTA plus statistics (n_sequences, alignment_length,
      per-sequence gap fractions, human-readable summary). Accepts either
      {fasta_path} or {fasta_text}; omit both to use the bundled
      5-sequence example.

      Requires the Rhea MCP server reachable at $RHEA_MCP_URL and the
      rhea Python package importable. See
      docs/running_nanobrain_workflows_via_mcp.md.
    source:
      kind: yaml
      path: composition/workflows/rhea_muscle_alignment/workflow.yml
    input_schema:
      type: object
      additionalProperties: false
      properties:
        fasta_path:
          type: string
          description: "Path to a FASTA file. Optional."
        fasta_text:
          type: string
          description: "Raw FASTA text. Optional. Takes priority over fasta_path."
      required: []
    requires:
      env:
        - RHEA_MCP_URL
      modules:
        - rhea
        - rhea.utils.proxy
      unavailable_hint: >-
        This workflow runs MUSCLE inside Rhea and therefore needs Docker + the
        Rhea MCP server. The server auto-provisions: the orchestrator auto-builds
        and runs the rhea-server container from a local rhea SOURCE checkout (git
        clone it next to apecx-mcp-integration/, or set RHEA_REPO_PATH), so no
        `apecx-setup rhea` build step is needed for the server. The workflow's rhea
        CLIENT modules (`rhea`, `rhea.utils.proxy`) must also be importable in the
        apecx venv, and the rhea TOOL CATALOG must be ingested — both are done by
        `apecx-setup rhea` (that ingestion autodeploy is deferred).
        WITHOUT Docker it does NOT run — and the MAFFT sequence-alignment path
        (`viral_conserved_sites`) is ALSO containerized now, so it needs Docker
        too (there is no host-binary alignment fallback). With Docker, use
        `viral_epitope_analysis` for full epitope analysis (sequence
        conservation + structural surface-exposure); without Docker that
        workflow still runs but its conservation (MAFFT) and structural (PyMOL)
        legs degrade loudly.
    timeout_seconds: 900.0
    # Workflow.run() deposits the input dict by FIRST-STEP input-data-unit
    # name, NOT by workflow-level input-data-unit name. The
    # rhea_muscle_alignment workflow's first step is `fasta_collection`
    # whose input DU is `fasta_collection_input`. The workflow-level
    # `workflow_input` declaration just documents the entry port; the
    # DirectLink workflow_input -> fasta_collection_input transfers when
    # the source changes, but `run` writes into the step input directly.
    # Mis-keying this field silently populates 0 data units — exactly the
    # silent-failure shape the input_envelope_key field exists to bridge.
    input_envelope_key: fasta_collection_input
    # MUSCLE has a multi-second gap between fasta_collection completing
    # and muscle_alignment finishing its remote MCP round-trip + the
    # ProxyStore fetch of the output files. The default 200ms settle is
    # too short for that quiet period — the cascade-drain detector
    # would declare drained while alignment_report is still pending and
    # return a partial result. Bump to 2000ms.
    settle_ms: 2000
    # The workflow has a single workflow-level output data unit named
    # `workflow_output` carrying {summary, n_sequences, alignment_length,
    # alignment_fasta, per_sequence}. Unwrap it so the MCP tool returns
    # those fields flat (Claude expects flat output; nested-under-DU
    # would be a leaky abstraction).
    output_envelope_key: workflow_output
    # Pre-install the muscle conda env at orchestrator startup time
    # (BEFORE apecx-mcp reports ready). Without this, the first
    # MUSCLE workflow invocation pays the full conda-create cost
    # (~30-90s on a fresh machine) AND risks wedging Rhea's Academy
    # actor if the install raises — every subsequent call would
    # return "Action 'run_tool' was cancelled by the agent" until
    # the operator restarts Rhea. Pre-warming bypasses the Academy
    # actor entirely (direct rhea.agent.utils.install_conda_env call)
    # so install errors are surfaced at startup, not at first call.
    prewarm_rhea_tools:
      - muscle

  # NOTE: the standalone `viral_conserved_sites` / `viral_conserved_sites_muscle` tools were
  # RETIRED from the desktop surface (2026-06-16). They required a pre-resolved `taxon_id`
  # (no free-text `query`) and their descriptions steered the model to run `harmonized_search`
  # FIRST — the exact "harmonized search must run separately" friction. `viral_epitope_analysis`
  # already NESTS the conserved-sites pipeline (its sequence leg builds the same MAFFT/MUSCLE
  # conservation via the viral_conserved_sites builder) AND accepts a bare free-text query, so
  # it supersedes both. The builders remain on disk (epitope nests them); they are simply no
  # longer registered as first-class catalog tools.

  - tool_name: viral_epitope_analysis
    description: |
      Identify and analyze B-cell epitopes / antigenic sites on a viral protein. This is the tool
      for ANY epitope / antigenic-site / antibody-target / vaccine-target question about a virus.

      USE IT FOR queries like: "what are the epitopes on chikungunya E1?", "find conserved
      antigenic sites on the dengue envelope protein", "which residues are good antibody/vaccine
      targets on the SARS-CoV-2 spike?", "predict B-cell epitopes for Mayaro virus", "where are
      the surface-exposed conserved sites on EEEV E2?".

      It PULLS THE DATA ITSELF (no pre-supplied data needed) and ANALYZES it end-to-end:
        - sequence-conservation — fetches BV-BRC genomes, runs a MAFFT alignment, finds the
          conserved (low-mutation) positions across strains;
        - structural surface-exposure — pulls PDB/EMDB structures and runs containerized PyMOL
          (per-residue SASA) to classify each conserved residue EXPOSED vs BURIED;
        - cross-references VIOLIN immunology + PubMed literature,
      then returns RANKED candidate epitopes (conserved AND surface-exposed) with cited sequence +
      structural evidence. A "Structural evidence (PDB / EMDB)" section is ALWAYS present (a no-hit
      is stated explicitly, never silent).

      Call with {query}; optionally {taxon_id, protein} to focus. Example:
      {query: "conserved surface-exposed epitopes on chikungunya E1", protein: "E1"}. NO apecx LLM
      is required in desktop/MCP mode — the assembled, cited evidence is returned for the calling
      assistant to write the answer; the headless backend synthesizes internally instead. Pulls
      from the Globus/PubMed sources over the network; each branch degrades loudly (never silent).
    source:
      kind: lightweight
      module: apecx_integration.composition.workflows.viral_epitope_analysis.builder
      function: build_viral_epitope_analysis_workflow
    input_schema:
      type: object
      additionalProperties: false
      properties:
        query:
          type: string
          description: "The scientist's free-text evidence question."
        taxon_id:
          type: integer
          description: "Optional NCBI taxon id to focus the query."
        protein:
          type: string
          description: "Optional protein/antigen name to focus structural lookup."
        requested_outputs:
          type: string
          description: >-
            'evidence_only' (default) or 'evidence_plus_design' (the latter needs a
            design_approval_id, else the gate returns needs_input).
        design_approval_id:
          type: string
          description: "Approval token (from the approval control plane) for design output."
      required:
        - query
    # First step is `normalize` (EvidenceQueryNormalizeStep); its input DU `normalize_input`
    # is the deposit point. It fans the params to assemble (query) AND the design gate
    # (control fields) — the deposit sets THIS DU, not workflow_input.
    input_envelope_key: normalize_input
    output_envelope_key: workflow_output
    # RHEA genomic-analysis is a mandatory PART of the analysis (always attempted + disclosed),
    # but it is NOT a hard prerequisite: when RHEA is unavailable the workflow DEGRADES LOUD
    # (prominent warning + honest fix instructions in the report — the server auto-provisions;
    # the rhea client library + tool-catalog ingestion are what `apecx-setup rhea` covers) and completes —
    # the MAFFT/structural/literature legs remain valid. So no `requires: rhea` gate here.
    # Concurrent network retrieval (Globus + PubMed + BV-BRC) + RHEA MUSCLE + one LLM round-trip.
    settle_ms: 3000
    # EF8: the full 23-step pipeline drives RHEA MUSCLE in TWO legs (sequence conservation +
    # rhea_genomic); the first-run conda build (~50s) + the distributed alignment pushes the cascade past
    # 600s (observed: cascade_timeout at 13/23 on a real RHEA run). 1200s gives the RHEA-MUSCLE path
    # headroom; the MAFFT-degrade + no-protein paths finish well under it.
    timeout_seconds: 1200.0

  # Follow-up assessment workflows (#2, 2026-07-01). Discovery-only before this: they were runnable
  # but had no catalog entry -> empty input_schema {} + a one-line AST description, so the frontier
  # LLM had no signal about WHEN to pick them or WHAT params to pass (they need an evidence handle +
  # an approval token). These curated entries surface their typed schemas (from the builders'
  # *_INPUT_SCHEMA constants) + a "USE IT FOR" description. LLM_ROLE=none -> no apecx LLM needed.
  - tool_name: conserved_epitope_candidate_assessment
    description: |
      Assess and rank the candidate B-cell epitopes / peptides produced by a PRIOR conserved-epitope
      evidence run (e.g. viral_epitope_analysis). It does NOT pull data itself — it consumes the
      evidence handle/bundle from that upstream run and returns a scored candidate-peptide assessment.

      USE IT FOR follow-up queries AFTER an epitope evidence run, like: "assess the candidate epitopes
      from that analysis", "which of these conserved sites are the best vaccine-peptide candidates?",
      "rank the candidate peptides". Releasing actual candidate PEPTIDE SEQUENCES requires a
      design_approval_id (approval token); without it the workflow returns needs_input for the
      approval rather than the sequences.

      Call with {assessment_input: {evidence_data_handle | evidence_bundle, assessment_question?,
      design_approval_id?}}. No apecx LLM is required in desktop/MCP mode.
    source:
      kind: lightweight
      module: apecx_integration.composition.workflows.conserved_epitope_candidate_assessment.builder
      function: build_conserved_epitope_candidate_assessment_workflow
    input_schema:
      type: object
      additionalProperties: false
      properties:
        evidence_data_handle:
          type: string
          description: >-
            The data_handle returned by the upstream conserved-region evidence workflow
            (viral_epitope_analysis / viral_epitope_evidence_review). Preferred over an inline bundle.
        evidence_bundle:
          type: object
          description: "Inline evidence Bundle payload; use only when no handle is available."
        assessment_question:
          type: string
          description: "Optional follow-up assessment question."
        design_approval_id:
          type: string
          description: >-
            Approval token from the approval control plane; REQUIRED before candidate peptide sequence
            output is released (else the workflow returns needs_input for the approval).
      required: []
    input_envelope_key: assessment_input
    output_envelope_key: workflow_output
    settle_ms: 500
    timeout_seconds: 120.0

  - tool_name: epitope_combination_feasibility_assessment
    description: |
      Assess whether MULTIPLE epitopes can be combined into a single multi-epitope construct, given
      evidence-limited inputs. Consumes the evidence + APPROVED candidate-assessment handles/bundles
      from prior runs plus any additional epitopes; does NOT pull data itself.

      USE IT FOR follow-up queries like: "can these epitopes be combined into one construct?", "assess
      the feasibility of a multi-epitope vaccine from these candidates", "combine the approved
      candidates with these additional epitopes". Releasing epitope-level combination output requires
      a design_approval_id (approval token); without it the workflow returns needs_input.

      Call with {combination_request: {evidence_data_handle? | evidence_bundle?,
      candidate_assessment_handle? | candidate_assessment_bundle?, additional_epitopes?,
      assessment_question?, design_approval_id?}}. No apecx LLM is required in desktop/MCP mode.
    source:
      kind: lightweight
      module: apecx_integration.composition.workflows.epitope_combination_feasibility_assessment.builder
      function: build_epitope_combination_feasibility_assessment_workflow
    input_schema:
      type: object
      additionalProperties: false
      properties:
        evidence_data_handle:
          type: string
          description: "Optional data_handle from the upstream evidence run."
        evidence_bundle:
          type: object
          description: "Inline evidence Bundle payload; use only when no handle exists."
        candidate_assessment_handle:
          type: string
          description: "data_handle returned by the approved candidate-peptide assessment."
        candidate_assessment_bundle:
          type: object
          description: "Inline approved candidate-peptide Bundle; use only when no handle exists."
        additional_epitopes:
          type: array
          items:
            type: object
          description: >-
            One or more additional epitopes with source metadata, coordinates, and optional sequence.
        assessment_question:
          type: string
          description: "Optional follow-up assessment question used for approval scoping."
        design_approval_id:
          type: string
          description: >-
            Approval token from the approval control plane; REQUIRED before epitope-level combination
            output is released (else the workflow returns needs_input).
      required: []
    input_envelope_key: combination_request
    output_envelope_key: workflow_output
    settle_ms: 500
    timeout_seconds: 120.0
