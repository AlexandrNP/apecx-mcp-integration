# mcp_workflow_catalog.yml — packaged default catalog of pre-made
# nanobrain workflows exposed as MCP tools.
#
# Loaded at server startup by `apecx_integration.mcp_surface.server`
# via `workflow_registry.load_catalog(...)`. Override via the
# APECX_MCP_WORKFLOW_CATALOG environment variable.
#
# Schema: src/apecx_integration/mcp_surface/workflow_registry.py
#   (Pydantic, extra='forbid' — typos rejected, never silently used)
#
# To add a new pre-made workflow, append an entry here. See
# docs/running_nanobrain_workflows_via_mcp.md for the full guide.

workflows:
  - tool_name: rhea_muscle_alignment
    description: |
      Align FASTA sequences using MUSCLE via Rhea over MCP. Returns the
      alignment FASTA plus statistics (n_sequences, alignment_length,
      per-sequence gap fractions, human-readable summary). Accepts either
      {fasta_path} or {fasta_text}; omit both to use the bundled
      5-sequence example.

      Requires the Rhea MCP server reachable at $RHEA_MCP_URL and the
      rhea Python package importable. See
      docs/running_nanobrain_workflows_via_mcp.md.
    source:
      kind: yaml
      path: composition/workflows/rhea_muscle_alignment/workflow.yml
    input_schema:
      type: object
      additionalProperties: false
      properties:
        fasta_path:
          type: string
          description: "Path to a FASTA file. Optional."
        fasta_text:
          type: string
          description: "Raw FASTA text. Optional. Takes priority over fasta_path."
      required: []
    requires:
      env:
        - RHEA_MCP_URL
      modules:
        - rhea
        - rhea.utils.proxy
    timeout_seconds: 900.0
    # Workflow.run() deposits the input dict by FIRST-STEP input-data-unit
    # name, NOT by workflow-level input-data-unit name. The
    # rhea_muscle_alignment workflow's first step is `fasta_collection`
    # whose input DU is `fasta_collection_input`. The workflow-level
    # `workflow_input` declaration just documents the entry port; the
    # DirectLink workflow_input -> fasta_collection_input transfers when
    # the source changes, but `run` writes into the step input directly.
    # Mis-keying this field silently populates 0 data units — exactly the
    # silent-failure shape the input_envelope_key field exists to bridge.
    input_envelope_key: fasta_collection_input
    # MUSCLE has a multi-second gap between fasta_collection completing
    # and muscle_alignment finishing its remote MCP round-trip + the
    # ProxyStore fetch of the output files. The default 200ms settle is
    # too short for that quiet period — the cascade-drain detector
    # would declare drained while alignment_report is still pending and
    # return a partial result. Bump to 2000ms.
    settle_ms: 2000
    # The workflow has a single workflow-level output data unit named
    # `workflow_output` carrying {summary, n_sequences, alignment_length,
    # alignment_fasta, per_sequence}. Unwrap it so the MCP tool returns
    # those fields flat (Claude expects flat output; nested-under-DU
    # would be a leaky abstraction).
    output_envelope_key: workflow_output
    # Pre-install the muscle conda env at orchestrator startup time
    # (BEFORE apecx-mcp reports ready). Without this, the first
    # MUSCLE workflow invocation pays the full conda-create cost
    # (~30-90s on a fresh machine) AND risks wedging Rhea's Academy
    # actor if the install raises — every subsequent call would
    # return "Action 'run_tool' was cancelled by the agent" until
    # the operator restarts Rhea. Pre-warming bypasses the Academy
    # actor entirely (direct rhea.agent.utils.install_conda_env call)
    # so install errors are surfaced at startup, not at first call.
    prewarm_rhea_tools:
      - muscle

  - tool_name: viral_conserved_sites
    description: |
      Find conserved protein sites across strains of a virus. Fetches real per-strain protein
      sequences from BV-BRC, builds a multiple-sequence alignment (MAFFT), scores per-column
      conservation, and returns conserved sites + regions with consensus motifs.

      Resolve the virus name to an NCBI taxon_id FIRST (e.g. via harmonized_search), then call
      with {taxon_id, protein}. Example: {taxon_id: 37124, protein: "structural polyprotein"}
      for Chikungunya. Requires a local 'mafft' binary on PATH and network access to BV-BRC.
    source:
      kind: lightweight
      module: apecx_integration.composition.workflows.viral_conserved_sites.builder
      function: build_viral_conserved_sites_workflow
    input_schema:
      type: object
      additionalProperties: false
      properties:
        taxon_id:
          type: integer
          description: "NCBI taxon id (e.g. 37124 for Chikungunya virus)."
        protein:
          type: string
          description: "Protein product name/substring (e.g. 'E1', 'capsid', 'structural polyprotein')."
        feature_type:
          type: string
          description: "BV-BRC feature_type (default CDS; 'mat_peptide' for mature peptides)."
      required:
        - taxon_id
        - protein
    requires:
      # mafft is an external binary (not a python module) — checked via shutil.which so
      # list_workflows reports honest availability instead of only failing at run time.
      binaries:
        - mafft
    timeout_seconds: 600.0
    # Workflow.run deposits by FIRST-STEP input-DU name (see rhea note above): the first step
    # is `fetch` (BvbrcProteinFastaStep) whose input DU is `fetch_in`.
    input_envelope_key: fetch_in
    # Terminal EnvelopeStep emits the WorkflowResult into the workflow-level `workflow_output`.
    output_envelope_key: workflow_output
    # Network (BV-BRC) + subprocess (MAFFT) gaps between steps — give the cascade time to settle.
    settle_ms: 2000

  - tool_name: viral_conserved_sites_muscle
    description: |
      Same as viral_conserved_sites but aligns with MUSCLE dispatched through the Rhea MCP
      server (the production aligner path) instead of a local MAFFT binary. The pluggable-aligner
      substitution: identical pipeline (BV-BRC fetch → MSA → per-column conservation → conserved
      sites/regions), only the MSA backend differs. Use this when you want the Rhea-managed MUSCLE
      aligner; use viral_conserved_sites for the dependency-light local-MAFFT path.

      Resolve the virus name to an NCBI taxon_id FIRST, then call with {taxon_id, protein}.
      Example: {taxon_id: 37124, protein: "structural polyprotein"} for Chikungunya. Requires a
      reachable Rhea MCP server ($RHEA_MCP_URL) + the rhea package importable, AND network access
      to BV-BRC.
    source:
      kind: lightweight
      module: apecx_integration.composition.workflows.viral_conserved_sites.builder
      function: build_viral_conserved_sites_muscle_workflow
    input_schema:
      type: object
      additionalProperties: false
      properties:
        taxon_id:
          type: integer
          description: "NCBI taxon id (e.g. 37124 for Chikungunya virus)."
        protein:
          type: string
          description: "Protein product name/substring (e.g. 'E1', 'capsid', 'structural polyprotein')."
        feature_type:
          type: string
          description: "BV-BRC feature_type (default CDS; 'mat_peptide' for mature peptides)."
      required:
        - taxon_id
        - protein
    requires:
      # MUSCLE runs over Rhea MCP (not a local binary) — same prerequisites as rhea_muscle_alignment.
      env:
        - RHEA_MCP_URL
      modules:
        - rhea
    timeout_seconds: 900.0
    input_envelope_key: fetch_in
    output_envelope_key: workflow_output
    # BV-BRC network + Rhea MCP round-trip (+ first-run conda build) — give the cascade headroom.
    settle_ms: 2000
