# Skeleton: pathogen extraction + BV-BRC mapping.
#
# Mirrors the violin_bvbrc T01-AC1 workflow but parameterized as a
# skeleton: extract pathogen names from a query, look them up in the
# local BV-BRC snapshot, return matched genome ids.
name: pathogen_bvbrc_match
description: >
  Extract pathogen entity names from a query, map them to BV-BRC
  genome ids using the local snapshot.
when_to_use: >
  User asks to "map pathogens to BV-BRC", "find genome ids", "look up
  organisms in the local catalog" — anything that combines entity NER
  with BV-BRC lookup.
spec:
  name: pathogen_bvbrc_match
  description: Extract pathogens; map to BV-BRC genome ids.
  version: "0.1.0"
  steps:
    - id: entity_extraction
      class_name: EntityExtractionStep
    - id: enhanced_bvbrc_match
      class_name: EnhancedBVBRCMatchStep
  links:
    - {source: workflow_input,                                 target: entity_extraction.user_query_input}
    - {source: entity_extraction.entity_candidates_output,     target: enhanced_bvbrc_match.entity_candidates_input}
    - {source: enhanced_bvbrc_match.snapshot_matches_output,   target: workflow_output}
