# muscle_alignment — the Rhea tool-dispatch step of rhea_muscle_alignment.
#
# Wraps RheaFileToolStep (nanobrain.library.steps.rhea_file_tool_step):
# stages the FASTA into Rhea's rhea-input ProxyStore, calls the MUSCLE
# tool over MCP (find_tools -> tools/call), and fetches the alignment
# output files back from the rhea-output ProxyStore.
#
# The static_tool_args mirror rhea/scripts/run_muscle_e2e.py exactly —
# the values MUSCLE's Cheetah <command> template needs to render fully.
#
# Step owns its data units + trigger; the workflow owns the links.

class: "nanobrain.library.steps.rhea_file_tool_step.RheaFileToolStep"
name: muscle_alignment
description: >
  Dispatch the MUSCLE multiple-sequence-alignment Galaxy tool to a Rhea
  MCP server via the file-input ProxyStore protocol.

mcp_url: "http://localhost:3001/mcp/"
redis_host: "localhost"
redis_port: 6379
input_store_name: "rhea-input"
output_store_name: "rhea-output"

tool_name: "muscle"
find_tools_query: "MUSCLE multiple sequence alignment of protein fasta"
file_input_arg: "input_seqs"
static_tool_args:
  diags: false
  run: "16"
  cluster: "upgmb"
  outputFormat: "fasta"
output_file_args:
  - "out_align"
  - "out_align_html"
timeout_seconds: 900.0

input_data_units:
  muscle_alignment_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: muscle_alignment_input
    description: >
      ``{fasta_name: str, fasta_bytes: bytes}`` (fasta_text: str also
      accepted) — the staged-file payload from FastaCollectionStep.
    persistent: false

output_data_units:
  muscle_alignment_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: muscle_alignment_output
    description: >
      ``{tool_name, return_code, stdout, stderr, output_files}`` —
      output_files maps each fetched file name to its decoded text.
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "muscle_alignment_input"
