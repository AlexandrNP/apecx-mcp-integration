# E5 — planner stage; same as benchmark_plan_then_code/steps/planner.yml.
# The rules are appended to the DRAFTER only (planner needs to emit
# a plan, not framework-conforming code).

class: "apecx_integration.composition.steps.benchmark_planner_step.BenchmarkPlannerStep"
name: planner
description: "Planner stage of E5 (rules + plan-then-code)."

system_prompt_file: "../../../code_writing_prompts/benchmark_planner_system.md"

role: planner
temperature: 0.0
max_tokens: 1024

input_data_units:
  planner_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: planner_input
    persistent: false

output_data_units:
  planner_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: planner_output
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "planner_input"
