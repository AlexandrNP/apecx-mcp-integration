class: "apecx_integration.composition.steps.consensus_aggregator_step.ConsensusAggregatorStep"
name: aggregator
description: "Deterministic voter; picks the candidate that passes the AST validator."

voting_strategy: ast_validator

input_data_units:
  aggregator_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: aggregator_input
    persistent: false

output_data_units:
  aggregator_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: aggregator_output
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "aggregator_input"
