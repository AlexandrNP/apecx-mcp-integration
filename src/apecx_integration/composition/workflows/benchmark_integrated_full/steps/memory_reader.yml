class: "apecx_integration.composition.steps.solution_memory_step.SolutionMemoryStep"
name: memory_reader
description: "Cross-problem memory lookup (read mode); enriches code_spec with cached passing solutions."

mode: read
examples_on_read: 1
max_per_category: 5

input_data_units:
  memory_reader_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: memory_reader_input
    persistent: false
    contract:
      kind: record
      required:
        code_spec: {kind: text}

output_data_units:
  memory_reader_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: memory_reader_output
    persistent: false
    contract:
      kind: record
      required:
        code_spec: {kind: text}

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "memory_reader_input"
