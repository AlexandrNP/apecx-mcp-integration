# Ablation E: F17 + aggregator + memory_recorder (no read).
#
# Tests the 2-of-3 combination: AST-wraps drafter output + writes the
# side effect, but does NOT enrich the drafter's prompt with memory.
# If this matches integrated_similarity's +10pp, the memory_reader is
# the irrelevant component.

name: benchmark_ablation_aggregator_memrecorder
description: >
  Ablation: F17 + aggregator + memory_recorder. Drops the memory_reader.
  Tests whether the read-side memory enrichment is necessary for the lift.
version: "0.1.0"
config_version: 2

input_data_units:
  workflow_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: workflow_input
    persistent: false
    contract:
      kind: record
      required:
        code_spec: {kind: text}

output_data_units:
  workflow_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: workflow_output
    persistent: false
    contract:
      kind: record
      required:
        code_source: {kind: text}
  workflow_recorder_status:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: workflow_recorder_status
    persistent: false
    contract:
      kind: record
      required:
        category: {kind: text}
      required_keys: [recorded, store_size_after]

steps:
  task_router_ablation:
    class: "apecx_integration.composition.steps.task_category_router_step.TaskCategoryRouterStep"
    config: "../benchmark_retrieval_grounded/steps/router.yml"
  drafter:
    class: "apecx_integration.composition.steps.benchmark_drafter_step.BenchmarkDrafterStep"
    config: "../benchmark_retrieval_grounded/steps/drafter.yml"
  aggregator:
    class: "apecx_integration.composition.steps.consensus_aggregator_step.ConsensusAggregatorStep"
    config: "../benchmark_integrated_similarity/steps/aggregator.yml"
  memory_recorder:
    class: "apecx_integration.composition.steps.solution_memory_step.SolutionMemoryStep"
    config: "../benchmark_integrated_similarity/steps/memory_recorder.yml"

links:
  input_to_router:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: workflow_input
      target: task_router_ablation.router_input
      auto_transfer: true
  router_to_drafter:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: task_router_ablation.router_output
      target: drafter.drafter_input
      auto_transfer: true
  drafter_to_aggregator:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: drafter.drafter_output
      target: aggregator.aggregator_input
      auto_transfer: true
  aggregator_to_output:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: aggregator.aggregator_output
      target: workflow_output
      auto_transfer: true
  aggregator_to_memrecorder:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: aggregator.aggregator_output
      target: memory_recorder.memory_recorder_input
      auto_transfer: true
  memrecorder_to_status:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: memory_recorder.memory_recorder_output
      target: workflow_recorder_status
      auto_transfer: true
