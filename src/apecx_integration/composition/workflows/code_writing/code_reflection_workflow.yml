# Code-reflection sub-workflow.
#
# The "reflection" reasoning pattern (Wang et al. 2022; surveyed in
# 2026 agentic literature as the canonical generate→critique loop)
# applied to Python code authoring.
#
# Two-step topology:
#
#   workflow_input ({code_spec, function_name, signature})
#       │
#       ▼
#   code_write          ← LLM generates source; AST-validated
#       │
#       │ {code_source, function_name_verified, code_spec passthrough}
#       ▼
#   code_review         ← LLM critique; structured verdict
#       │
#       ▼
#   workflow_output ({code_source, function_name_verified,
#                     approved, reasoning, concerns, suggestions, ...})
#
# v1 ships the generate→critique single pass. The full reflection
# loop (write → review → IF rejected refine → review again) is a
# v2 enhancement; the composer's outer workflow can act on the
# `approved` verdict to retry by re-invoking this sub-workflow with
# critique as input.

name: code_reflection_workflow
description: >
  Reflection pattern over Python code: generate via CodeWriteStep,
  critique via CodeReviewStep. Emits the generated code AND the
  structured verdict so the surrounding workflow can refine, retry,
  or escalate based on the approved/concerns fields.
version: "0.1.0"
config_version: 2

input_data_units:
  workflow_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: workflow_input
    description: >
      Dict {code_spec: str, function_name?: str, function_signature?: str,
      previous_attempt?: str, critique?: str}. Forwarded to code_write
      via the input_to_write DirectLink.
    persistent: false
    # Project A Step 3c — matches code_write.code_write_input (both-declared + compatible).
    contract:
      kind: record
      required:
        code_spec: {kind: text}

output_data_units:
  reflection_result:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: reflection_result
    description: >
      Single-output bundle from CodeReviewStep's full passthrough
      output: ``{code_source, function_name_verified, code_spec,
      function_name, function_signature, review_verdict (alias),
      approved, reasoning, concerns, suggestions, raw_response,
      spec_id, spec_keywords, attempt_n}``. Single-output (vs the
      earlier parallel-link design with three outputs) so the
      SubworkflowStep single-output flatten applies and downstream
      steps see a flat dict rather than a doubly-wrapped envelope.
    persistent: false
    # Project A Step 3c — subset of code_review.code_review_output (compatible). Only the verdict
    # fields code_review_output's contract guarantees are required here (code_source/code_spec are
    # passthrough but NOT in code_review_output's declared contract, so not required here).
    contract:
      kind: record
      required:
        reasoning: {kind: text}
        concerns: {kind: collection}
        suggestions: {kind: collection}
      required_keys: [approved]

steps:
  code_write:
    class: "apecx_integration.composition.steps.code_write_step.CodeWriteStep"
    config: "steps/code_write.yml"

  code_review:
    class: "apecx_integration.composition.steps.code_review_step.CodeReviewStep"
    config: "steps/code_review.yml"

links:
  # ──────────────────────────────────────────────────────────────────
  # auto_transfer: true on every DirectLink. Without it, the workflow
  # loads cleanly but turns into a no-op at runtime (dominant silent-
  # failure shape per workspace CLAUDE.md).
  # ──────────────────────────────────────────────────────────────────

  input_to_write:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: "direct"
      source: "workflow_input"
      target: "code_write.code_write_input"
      auto_transfer: true

  # code_write's output carries BOTH the generated code AND the
  # passthrough spec/name/signature, so a single link feeds the
  # reviewer (no intermediate plumbing step needed).
  write_to_review:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: "direct"
      source: "code_write.code_write_output"
      target: "code_review.code_review_input"
      auto_transfer: true

  # Single workflow-level output is populated from code_review's
  # passthrough output (which carries BOTH the review verdict AND
  # the upstream code_source/function_name/spec from code_write).
  # Replaces the earlier three-parallel-link design that produced
  # ambiguous data (multiple workflow-level outputs receiving the
  # SAME source value via different links).
  review_to_reflection_result:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: "direct"
      source: "code_review.code_review_output"
      target: "reflection_result"
      auto_transfer: true
