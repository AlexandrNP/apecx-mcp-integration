# CodeReviewStep wrapper — structured critique of code against spec.
#
# Consumes the output of code_write (which includes the code AND the
# original spec via passthrough fields). Emits a structured verdict
# the surrounding workflow can act on.

class: "apecx_integration.composition.steps.code_review_step.CodeReviewStep"
name: code_review
description: "Review code against a spec; emit structured JSON verdict."

temperature: 0.0
max_tokens: 768
require_concerns_when_rejecting: true

input_data_units:
  code_review_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: code_review_input
    description: >
      Dict {code_source: str, code_spec: str, function_name?: str,
      function_signature?: str}. Typically supplied by code_write's
      passthrough output via the write_to_review DirectLink.
    persistent: false

output_data_units:
  code_review_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: code_review_output
    description: >
      Dict {approved: bool, reasoning: str, concerns: list[str],
      suggestions: list[str], raw_response: str}.
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "code_review_input"
