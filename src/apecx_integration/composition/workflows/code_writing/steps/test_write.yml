# TestWriteStep wrapper — LLM-backed pytest authoring.
#
# Pairs with CodeWriteStep: consumes code_source + code_spec, emits
# test_code + the passthrough fields so a downstream IsolatedPyExecStep
# can run code + tests in one subprocess.

class: "apecx_integration.composition.steps.test_write_step.TestWriteStep"
name: test_write
description: "Author pytest tests for a given function via LLM."

temperature: 0.0
max_tokens: 1024
min_tests: 2

input_data_units:
  test_write_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: test_write_input
    description: >
      Dict {code_source: str, code_spec: str, function_name?: str}.
      Typically supplied by CodeWriteStep's passthrough output.
    persistent: false
    # Project A Step 3b — code_source + code_spec always present (matches code_write_output, so
    # the code_write->test_write boundary is both-declared + compatible). function_name optional.
    # NOTE (asymmetry): TestWriteStep.process() itself TOLERATES a missing code_spec (defaults
    # to ""); the contract requires it because the sole wired producer (code_write_output)
    # guarantees it. A future standalone wiring that omits code_spec would correctly fail under
    # config_version:3 — declare code_spec optional there if such a producer is added.
    contract:
      kind: record
      required:
        code_source: {kind: text}
        code_spec: {kind: text}

output_data_units:
  test_write_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: test_write_output
    description: >
      Dict {test_code: str, test_function_count: int, code_source: str,
      code_spec: str, function_name: str | None}. Passthrough of
      code_source so the runner can concatenate code + tests.
    persistent: false
    # Project A Step 3b — test_function_count is int (no scalar kind) -> required_keys.
    # function_name is str|None -> undeclared.
    contract:
      kind: record
      required:
        test_code: {kind: text}
        code_source: {kind: text}
        code_spec: {kind: text}
      required_keys: [test_function_count]

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "test_write_input"
