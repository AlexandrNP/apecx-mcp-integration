# MemoryWriteStep wrapper — persist a reflexion-style lesson.

class: "apecx_integration.composition.steps.memory_write_step.MemoryWriteStep"
name: memory_write
description: >
  Write a memory entry derived from a review verdict + (optional)
  verifier result. Gated to skip restatements + low-signal lessons
  by default.

memory_dir: "../../../../../memory/code_writing"
skip_if_restatement: true
min_lesson_chars: 40

input_data_units:
  memory_write_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: memory_write_input
    description: >
      Dict {spec_id, attempt_n?, code_source?, code_spec?,
      function_name?, function_signature?, spec_keywords?,
      review_verdict?, exec_result?, lesson?}. Typically supplied
      by CodeReviewStep's passthrough output.
    persistent: false
    # Project A Step 3b — only spec_id is always required (str); all else branch-optional.
    contract:
      kind: record
      required:
        spec_id: {kind: text}

output_data_units:
  memory_write_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: memory_write_output
    description: >
      Dict {written: bool, reason: str, entry_path: str | None,
      lesson_used: str, status_classified: str}.
    persistent: false
    # Project A Step 3b — reason/lesson_used/status_classified text; written(bool) -> required_keys;
    # entry_path str|None -> undeclared.
    contract:
      kind: record
      required:
        reason: {kind: text}
        lesson_used: {kind: text}
        status_classified: {kind: text}
      required_keys: [written]

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "memory_write_input"
