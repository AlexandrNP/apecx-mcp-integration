# Ablation C: F17 + memory_recorder ONLY (no memory_reader, no aggregator).
#
# Tests whether the side-effect recorder alone (no read, just write)
# somehow shifts pass@1. The drafter's output flows BOTH to workflow_output
# (the canonical path) AND to memory_recorder (side-effect that has no
# downstream consumer of code_source).
#
# Brutal-truth prediction: 0pp shift. The recorder runs AFTER the drafter
# finishes; cannot affect drafter output. If this ablation DOES shift
# pass@1, something weirder is happening (cascade-fanout timing?).

name: benchmark_ablation_memrecorder_only
description: >
  Ablation: F17 + memory_recorder side-effect. Tests whether the
  downstream recorder alone shifts pass@1 (should not — recorder runs
  after drafter completes).
version: "0.1.0"
config_version: 2

input_data_units:
  workflow_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: workflow_input
    persistent: false

output_data_units:
  workflow_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: workflow_output
    persistent: false
  workflow_recorder_status:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: workflow_recorder_status
    persistent: false

steps:
  task_router_ablation:
    class: "apecx_integration.composition.steps.task_category_router_step.TaskCategoryRouterStep"
    config: "../benchmark_retrieval_grounded/steps/router.yml"
  drafter:
    class: "apecx_integration.composition.steps.benchmark_drafter_step.BenchmarkDrafterStep"
    config: "../benchmark_retrieval_grounded/steps/drafter.yml"
  memory_recorder:
    class: "apecx_integration.composition.steps.solution_memory_step.SolutionMemoryStep"
    config: "../benchmark_integrated_similarity/steps/memory_recorder.yml"

links:
  input_to_router:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: workflow_input
      target: task_router_ablation.router_input
      auto_transfer: true
  router_to_drafter:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: task_router_ablation.router_output
      target: drafter.drafter_input
      auto_transfer: true
  drafter_to_output:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: drafter.drafter_output
      target: workflow_output
      auto_transfer: true
  drafter_to_memrecorder:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: drafter.drafter_output
      target: memory_recorder.memory_recorder_input
      auto_transfer: true
  memrecorder_to_status:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: memory_recorder.memory_recorder_output
      target: workflow_recorder_status
      auto_transfer: true
