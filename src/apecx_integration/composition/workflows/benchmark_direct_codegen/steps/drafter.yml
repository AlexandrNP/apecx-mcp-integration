# BenchmarkDrafterStep wrapper for the benchmark_direct_codegen workflow.
#
# Single LLM call. ``role: drafter`` resolves to model_roles.drafter
# in composer_config.yml (default mistral-nemo:latest) per
# tests/benchmarks/model_roles.resolve_role's contract.

class: "apecx_integration.composition.steps.benchmark_drafter_step.BenchmarkDrafterStep"
name: drafter
description: "Single-LLM-call code drafter for benchmark problems."

# Use the bundled benchmark-specific prompt (minimal, terse — no
# composer-internal context like 'workflow YAML' or 'closed-class').
system_prompt_file: "../../../code_writing_prompts/benchmark_drafter_system.md"

role: drafter
temperature: 0.0
max_tokens: 1024

input_data_units:
  drafter_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: drafter_input
    description: >
      Dict {code_spec: str, entry_point?: str, test_hint?: str,
      function_signature?: str}. Mirrors the BenchmarkProblem shape
      the runner-side adapter packages.
    persistent: false
    # Project A Step 3c — BenchmarkDrafterStep requires code_spec (str); rest optional.
    contract:
      kind: record
      required:
        code_spec: {kind: text}

output_data_units:
  drafter_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: drafter_output
    description: "Dict {code_source: str} carrying the extracted candidate code."
    persistent: false
    # Project A Step 3c — BenchmarkDrafterStep returns {code_source: str}.
    contract:
      kind: record
      required:
        code_source: {kind: text}

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "drafter_input"
