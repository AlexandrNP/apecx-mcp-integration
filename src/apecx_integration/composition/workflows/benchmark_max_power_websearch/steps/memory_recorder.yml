class: "apecx_integration.composition.steps.solution_memory_step.SolutionMemoryStep"
name: memory_recorder
description: "Record-mode memory; gated on aggregator's voted_passes >= 1."

mode: record
max_per_category: 5
record_only_if_pass: true

input_data_units:
  memory_recorder_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: memory_recorder_input
    persistent: false
    contract:
      kind: record
      required:
        code_source: {kind: text}

output_data_units:
  memory_recorder_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: memory_recorder_output
    persistent: false
    contract:
      kind: record
      required:
        category: {kind: text}
      required_keys: [recorded, store_size_after]

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "memory_recorder_input"
