# Reviser stage — same step class as drafter (BenchmarkDrafterStep)
# but with a different prompt that incorporates previous_attempt +
# critique. The drafter's _build_user_message already handles those
# fields when present.

class: "apecx_integration.composition.steps.benchmark_drafter_step.BenchmarkDrafterStep"
name: reviser
description: "Reviser — produces revised code informed by the reviewer's critique."

system_prompt_file: "../../../code_writing_prompts/benchmark_reviser_system.md"
rules_file: "../../../code_writing_prompts/nanobrain_rules.md"

role: drafter
temperature: 0.0
max_tokens: 1024

input_data_units:
  drafter_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: drafter_input
    persistent: false

output_data_units:
  drafter_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: drafter_output
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "drafter_input"
