class: "apecx_integration.composition.steps.task_category_router_step.TaskCategoryRouterStep"
name: task_router_max_power
description: "Router for the max-power composition (nanobrain mode + worked examples)."

fallback_mode: nanobrain

input_data_units:
  router_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: router_input
    persistent: false
    contract:
      kind: record
      required:
        code_spec: {kind: text}

output_data_units:
  router_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: router_output
    persistent: false
    contract:
      kind: record
      required:
        code_spec: {kind: text}

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "router_input"
