# Sequence Analysis Step — BV-BRC integration and alignment
#
# Performs sophisticated sequence-level reasoning:
# - Retrieves viral sequences from BV-BRC database
# - Multiple sequence alignment using MUSCLE algorithm
# - Conservation analysis across phylogenetic clades
# - Temporal and geographic coverage assessment

class: "apecx_integration.composition.steps.sequence_analysis_step.SequenceAnalysisStep"
name: sequence_analysis
description: >
  BV-BRC sequence retrieval and multiple sequence alignment for epitope
  conservation analysis. Identifies highly conserved regions with
  configurable conservation thresholds.

# Analysis parameters
max_sequences: 50
conservation_threshold: 0.90
temporal_range_years: 20
bvbrc_base_url: "https://www.bv-brc.org/api/genome"

# External tool configuration
muscle_executable: "muscle"  # Override with full path if needed

input_data_units:
  query_data:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: query_data
    description: >
      Query specification: {virus_name: str, protein_target: str,
      analysis_type: str}. Drives sequence retrieval and analysis
      parameters.
    persistent: false

output_data_units:
  sequence_analysis_result:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: sequence_analysis_result
    description: >
      Sequence analysis results: {sequences_retrieved: int,
      alignment_file: str, conservation_analysis: dict,
      execution_metadata: dict}. Contains conservation scores,
      conserved regions, and coverage statistics.
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "query_data"
