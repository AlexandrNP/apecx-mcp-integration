# BenchmarkDrafterStep wrapper for the benchmark_plan_then_code workflow.
#
# Same step class as benchmark_direct_codegen/steps/drafter.yml,
# different prompt-file path (reuses the same prompt — drafter behavior
# is unchanged). The drafter reads {code_spec: <planner-enriched>, ...}
# and emits {code_source}.

class: "apecx_integration.composition.steps.benchmark_drafter_step.BenchmarkDrafterStep"
name: drafter
description: "Drafter stage of the plan-then-code scaffold."

system_prompt_file: "../../../code_writing_prompts/benchmark_drafter_system.md"

role: drafter
temperature: 0.0
max_tokens: 1024

input_data_units:
  drafter_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: drafter_input
    description: >
      Dict {code_spec: <planner-enriched>, entry_point?, test_hint?,
      function_signature?}. The planner stage prefixes the original
      spec with ``Suggested plan:`` text.
    persistent: false

output_data_units:
  drafter_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: drafter_output
    description: "Dict {code_source: str}."
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "drafter_input"
