# Ablation A: F17 + memory_reader ONLY (no aggregator, no recorder).
#
# Isolates whether memory_reader (similarity_read with empty-store
# fallback to tier-1) alone drives the +10pp lift on nanobrain-native
# vs F17. Same router, same drafter as F17 retrieval_grounded.
#
# Step count: 3 (vs F17=2, vs integrated_similarity=5).
# All step configs are path-referenced from sibling workflows to avoid
# duplication.

name: benchmark_ablation_memreader_only
description: >
  Ablation: F17 + memory_reader (similarity_read mode). Tests whether
  the memory_reader alone shifts the LLM output.
version: "0.1.0"
config_version: 2

input_data_units:
  workflow_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: workflow_input
    persistent: false
    contract:
      kind: record
      required:
        code_spec: {kind: text}

output_data_units:
  workflow_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: workflow_output
    persistent: false
    contract:
      kind: record
      required:
        code_source: {kind: text}

steps:
  task_router_ablation:
    class: "apecx_integration.composition.steps.task_category_router_step.TaskCategoryRouterStep"
    config: "../benchmark_retrieval_grounded/steps/router.yml"
  memory_reader:
    class: "apecx_integration.composition.steps.solution_memory_step.SolutionMemoryStep"
    config: "../benchmark_integrated_similarity/steps/memory_reader.yml"
  drafter:
    class: "apecx_integration.composition.steps.benchmark_drafter_step.BenchmarkDrafterStep"
    config: "../benchmark_retrieval_grounded/steps/drafter.yml"

links:
  input_to_router:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: workflow_input
      target: task_router_ablation.router_input
      auto_transfer: true
  router_to_memory_reader:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: task_router_ablation.router_output
      target: memory_reader.memory_reader_input
      auto_transfer: true
  memory_reader_to_drafter:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: memory_reader.memory_reader_output
      target: drafter.drafter_input
      auto_transfer: true
  drafter_to_output:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: direct
      source: drafter.drafter_output
      target: workflow_output
      auto_transfer: true
