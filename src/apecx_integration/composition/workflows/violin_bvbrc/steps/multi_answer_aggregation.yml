# STEP-AGG — self-consistency aggregation wrapper.
#
# Aggregates a list of candidate answers (typically from N independent
# upstream RagSynthesisStep invocations) into a single answer.
#
# Pure Python, no LLM call. See
# composition/steps/multi_answer_aggregation_step.py for the full
# strategy enum (most_frequent / longest / first / concatenate).

class: "apecx_integration.composition.steps.multi_answer_aggregation_step.MultiAnswerAggregationStep"
name: multi_answer_aggregation
description: "Aggregate a list of candidate answers into a single answer (self-consistency)."

aggregation_strategy: most_frequent
concatenate_separator: "\n\n---\n\n"

input_data_units:
  candidate_answers_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: candidate_answers_input
    description: >
      List of candidate answer strings. Each item should be one
      independent generation from an upstream step (RagSynthesisStep
      run N times, agent ensemble, etc.).
    persistent: false

output_data_units:
  aggregated_answer_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: aggregated_answer_output
    description: >
      Single string aggregating the candidates per the configured
      strategy. Empty input is a step error (raised in process()),
      not a silent passthrough.
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "candidate_answers_input"
