# T02 Phase 3 — BV-BRC alphavirus genome snapshot reader.
#
# Reads ``data/bvbrc_cache/alphavirus_genomes.tsv`` (TSV, 2 columns:
# genome.genome_id + genome.genome_name). Output feeds Step 2
# (bvbrc_snapshot_match) as the cache of known alphavirus genomes
# for entity-term matching.
#
# Uses ``format: tsv`` — the step maps ``tsv`` → tab delimiter
# internally. This dodges a nanobrain-layer quirk where tab-
# containing strings get whitespace-stripped during Pydantic config
# load; see docs/future_work.md under "Nanobrain config
# whitespace-stripping".

class: "apecx_integration.composition.steps.file_readers.DelimitedFileReaderStep"
name: bvbrc_alphavirus_genomes_reader
description: "Read BV-BRC alphavirus_genomes.tsv into list-of-dicts."

input_data_units: {}

output_data_units:
  genome_rows_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: genome_rows_output
    description: "Rows keyed by genome.genome_id / genome.genome_name."
    persistent: false

triggers: []

file_path: "data/bvbrc_cache/alphavirus_genomes.tsv"
format: tsv
encoding: "utf-8"
required_columns:
  - genome.genome_id
  - genome.genome_name
