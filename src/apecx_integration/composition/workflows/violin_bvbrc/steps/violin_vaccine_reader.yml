# T02 Phase 3 — VIOLIN vaccine-info reader.
#
# Reads ``data/violin/Vaccine_Information.csv`` into a list of row
# dicts. Emits a cheap sanity check via required_columns — catches the
# case where the CSV has drifted (column rename / removal) before any
# downstream joiner reads null fields.

class: "apecx_integration.composition.steps.file_readers.DelimitedFileReaderStep"
name: violin_vaccine_reader
description: "Read VIOLIN Vaccine_Information.csv into list-of-dicts."

input_data_units: {}   # file is read eagerly from config; no input data unit needed

output_data_units:
  vaccine_rows_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: vaccine_rows_output
    description: "Rows keyed by VIOLIN column name."
    persistent: false

triggers: []

file_path: "data/violin/Vaccine_Information.csv"
format: csv
encoding: "utf-8"
required_columns:
  - id
  - Vaccine
  - Vaccine_Name
  - Vaccine_Ontology_ID
  - Type
  - Status
