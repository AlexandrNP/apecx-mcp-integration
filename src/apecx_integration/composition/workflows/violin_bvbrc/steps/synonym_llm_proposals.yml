# Workflow spec Step 3c — synonym_llm_proposals
#
# LLM-driven synonym proposal for terms that missed the verified-synonym
# cache (Step 3a). Wraps apecx_db_integration.consolidated_synonym_search
# (see src/apecx_integration/composition/steps/db_integration_wrappers.py).
#
# Two LLM round-trips per process() call: one for entity extraction (the
# wrapped function calls extract_entities_llm internally), one for synonym
# matching against candidate terms loaded from the VIOLIN tables.

class: "apecx_integration.composition.steps.db_integration_wrappers.SynonymLLMProposalsStep"
name: synonym_llm_proposals
description: "Propose canonical synonyms for cache-miss terms (LLM)."

input_data_units:
  novel_terms_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: novel_terms_input
    description: "List of terms that missed the verified-synonym cache (from Step 3a)."
    persistent: false

output_data_units:
  llm_proposals_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: llm_proposals_output
    description: >
      List of proposal dicts: {query_entity, synonym, score}. Schema
      must match synonym_approval_gate (Step 4)'s llm_proposals_input.
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "novel_terms_input"

# Step-specific config. data_dir is optional — defaults to APECX_DB_DATA_DIR
# env var. Override only if this workflow needs a non-standard data path.
data_dir: null
