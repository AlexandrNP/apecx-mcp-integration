# Workflow spec Step 3a — synonym_cache_lookup
#
# Batched lookup against the Control Plane's VerifiedSynonym cache.
# Emits (cached_mappings, novel_terms); novel_terms flows into Step 3c
# (LLM proposals), cached_mappings short-circuits around the LLM + HITL
# gate.

class: "apecx_integration.composition.steps.synonym_cache.SynonymCacheLookupStep"
name: synonym_cache_lookup
description: "Batched lookup in the Control Plane's VerifiedSynonym cache."

input_data_units:
  query_terms_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: query_terms_input
    description: "Entity terms from Step 2 (bvbrc_snapshot_match) to look up."
    persistent: false

output_data_units:
  cache_lookup_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: cache_lookup_output
    description: "Dict with 'cached_mappings' and 'novel_terms' keys."
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "query_terms_input"

# Step-specific config consumed by SynonymCacheLookupStep._init_from_config.
source_vocabulary: user_query
target_vocabulary: violin.pathogen_id
scope: null

control_plane:
  # Defaults to the local-dev apecx-cp URL (docker-compose.yml exposes
  # port 8000). Override ``CONTROL_PLANE_URL`` for BYO-infra deployments.
  base_url: "${CONTROL_PLANE_URL:-http://localhost:8000}"
  request_timeout_seconds: 10.0
