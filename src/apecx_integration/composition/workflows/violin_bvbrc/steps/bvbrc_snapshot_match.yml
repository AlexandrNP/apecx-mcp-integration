# Workflow spec Step 2 — bvbrc_snapshot_match
#
# Wraps nanobrain's EnhancedBVBRCDataAcquisitionStep. The step's
# ``_create_bv_brc_tool`` reads ``tools.bv_brc_tool.config_file``
# from the component config, loads the YAML at that path, and
# instantiates whatever ``class`` the tool YAML names. We point it
# at our BVBRCSnapshotTool so Step 2 reads from data/bvbrc_cache/*
# instead of calling the live BV-BRC API.
#
# Taxonomic-verification agent: the step's enhanced-validation path
# requires a TaxonomicVerificationAgent (LLM). Not wired yet
# (avoiding LLM-in-test-init); when T01 vertical slice runs, it
# will supply the agent YAML either via ``tools`` or via the
# fallback ``../config/DataAcquisitionStep/TaxonomicVerificationAgent.yml``.

class: "nanobrain.library.workflows.viral_protein_analysis.steps.enhanced_bv_brc_data_acquisition_step.EnhancedBVBRCDataAcquisitionStep"
name: bvbrc_snapshot_match
description: "Match extracted entity names against the local BV-BRC snapshot."

input_data_units:
  entity_candidates_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: entity_candidates_input
    description: "LLM-extracted entity candidates from Step 1."
    persistent: false

output_data_units:
  snapshot_matches_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: snapshot_matches_output
    description: "Entity → (genome_id | protein_id) candidates with scores."
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "entity_candidates_input"

tools:
  bv_brc_tool:
    config_file: "src/apecx_integration/composition/workflows/violin_bvbrc/tools/bv_brc_snapshot_tool.yml"
  # The enhanced step's _init_from_config requires both a species-
  # validation agent AND a taxonomic-verification agent. We point at
  # the existing nanobrain library YAMLs; instantiating those agents
  # does NOT trigger an LLM call (the call happens at process()
  # time), so init passes without an API key — but running the step
  # at T01 time will need OPENAI_API_KEY set.
  species_validation_agent:
    config_file: "/Users/onarykov/Downloads/apecx-cowork/nanobrain/nanobrain/library/workflows/viral_protein_analysis/config/AnnotationMappingStep/SynonymDetectionAgent.yml"
  taxonomic_verification_agent:
    config_file: "/Users/onarykov/Downloads/apecx-cowork/nanobrain/nanobrain/library/workflows/viral_protein_analysis/config/AnnotationMappingStep/SynonymDetectionAgent.yml"
