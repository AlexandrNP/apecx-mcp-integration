# Workflow spec Step 6 — genomic_annotation
#
# Wraps nanobrain's BVBRCDataAcquisitionStep. Unlike Step 2 (which
# reads agents from ``tools:``), this step reads a top-level
# ``synonym_detection_agent`` field (see
# bv_brc_data_acquisition_step.py:_init_from_config line 132).
#
# The BVBRCTool wiring is handled by the step's
# ``_initialize_tools(config, None)`` call — at first-run it falls
# back to the default tool YAML path unless we supply a
# ``bv_brc_tool`` config file explicitly. For loadability we point
# at our snapshot tool here.

class: "nanobrain.library.workflows.viral_protein_analysis.steps.bv_brc_data_acquisition_step.BVBRCDataAcquisitionStep"
name: genomic_annotation
description: "Enrich matched genomes with canonical protein annotations from the BV-BRC snapshot."

input_data_units:
  resolved_genomes_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: resolved_genomes_input
    description: "Genome / protein IDs resolved via the synonym pipeline."
    persistent: false

output_data_units:
  genomic_annotations_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: genomic_annotations_output
    description: "Protein-annotation records keyed by genome_id + patric_id."
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "resolved_genomes_input"

synonym_detection_agent:
  config_file: "/Users/onarykov/Downloads/apecx-cowork/nanobrain/nanobrain/library/workflows/viral_protein_analysis/config/AnnotationMappingStep/SynonymDetectionAgent.yml"

# Step 6 (BVBRCDataAcquisitionStep) reads ``config.bvbrc_config_file``
# (default ``demos/viral_pssm_workflow/config/bvbrc_tool_config.yml``);
# we override to point at the snapshot tool we author in T02 Phase 4.
bvbrc_config_file: "src/apecx_integration/composition/workflows/violin_bvbrc/tools/bv_brc_snapshot_tool.yml"
