# Workflow spec Step 4p — verified_synonym_writeback
#
# Persists approved synonyms to the Control Plane cache so future
# runs short-circuit past the LLM + HITL review for the same terms.
# 409 collisions (another run recorded the same mapping first) are
# reported via the ``already_existed`` output, not raised.

class: "apecx_integration.composition.steps.synonym_cache.VerifiedSynonymWritebackStep"
name: verified_synonym_writeback
description: "Write approved synonyms back to the VerifiedSynonym cache."

input_data_units:
  approved_mappings_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: approved_mappings_input
    description: "Approved synonym mappings from Step 4 (ApprovalStep)."
    persistent: false

output_data_units:
  writeback_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: writeback_output
    description: "Dict with 'written' (ids) and 'already_existed' (terms)."
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "approved_mappings_input"

source_vocabulary: user_query
target_vocabulary: violin.pathogen_id
scope: null
verified_by: api_user

control_plane:
  # Defaults to the local-dev apecx-cp URL (docker-compose.yml exposes
  # port 8000). Override ``CONTROL_PLANE_URL`` for BYO-infra deployments.
  base_url: "${CONTROL_PLANE_URL:-http://localhost:8000}"
  request_timeout_seconds: 10.0
