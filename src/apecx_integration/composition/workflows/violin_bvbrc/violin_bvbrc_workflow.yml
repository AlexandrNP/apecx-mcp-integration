# VIOLIN × BV-BRC workflow — first-release HARD-synonym variant.
#
# T04 update: T01 vertical slice now wired with 5 DirectLinks. The
# remaining steps (Step 2, 5, 6) stay defined under ``steps:`` so the
# workflow YAML still loads them, but they are not on the linked T01
# path and are documented as deferred.
#
# Coverage vs. T00.1b workflow_spec.md (post-T04):
#
#   Step ID | step_name                  | T01 chain
#   --------+----------------------------+------------------------------
#   0       | vocabulary extraction      | deferred (HARD directive)
#   1       | entity_extraction          | ✅ T01 step 1 of 6
#   2       | bvbrc_snapshot_match       | DEFERRED — parallel-branch
#                                          step that joins at Step 6;
#                                          since Step 6 is also deferred
#                                          from T01, Step 2 has no
#                                          downstream consumer in this
#                                          slice. Still loadable; just
#                                          unlinked. See note below.
#   3a      | synonym_cache_lookup       | ✅ T01 step 2 of 6
#   3b      | synonym_fuzzy_match        | deferred (HARD directive)
#   3c      | synonym_llm_proposals      | ✅ T01 step 3 of 6
#   4       | synonym_approval_gate      | ✅ T01 step 4 of 6
#   4p      | verified_synonym_writeback | ✅ T01 step 5 of 6
#   5       | violin_entity_lookup       | DEFERRED — enrichment step
#                                          dropped by next_tasks Task 4
#                                          (T01 ships without VIOLIN
#                                          cross-join). Still loadable.
#   6       | genomic_annotation         | DEFERRED — same reason as
#                                          Step 5 (enrichment step).
#   7       | result_ranking             | ✅ T01 step 6 of 6
#   8       | rag_synthesis              | LOADED-BUT-UNLINKED — final
#                                          synthesis step (Day 2 v9).
#                                          The step expects an
#                                          aggregated four-source bundle
#                                          (BV-BRC genomes + VIOLIN
#                                          mappings + RAG chunks +
#                                          DataCite pubs); upstream
#                                          steps don't produce the RAG
#                                          chunks or pubs yet, so the
#                                          step is registered but not
#                                          on the T01 link chain. A
#                                          TransformLink that assembles
#                                          the bundle from a future
#                                          retrieval+harvester step is
#                                          Phase-2+ wiring.
#
# Why Step 2 is loaded but unlinked
# ---------------------------------
# Per workflow_spec.md §3.1, Step 2 is on a parallel branch:
#   Step 1 ──> Step 2 ─────────────────────> Step 6 ──> Step 7
#         └──> Step 3a ──> 3c ──> 4 ──> 4p ─> Step 5 ──> Step 6
#
# The chosen nanobrain step (EnhancedBVBRCDataAcquisitionStep) has an
# input contract that requires ``ultra_high_confidence_synonyms`` —
# i.e., it expects HITL-validated synonyms, not raw entity candidates.
# So even if T01 had wired Step 1 → Step 2 directly, Step 2 would
# raise ValueError on every run. The spec at §4 line 197 anticipated
# this: "Both [Step 2 and 6] can be worked around by building
# parallel Step 2 and Step 6 wrappers in apecx_integration/." That
# parallel-wrapper work lands when Step 6 is brought back in scope.
#
# Plus two demo file-readers (violin_vaccine_reader,
# bvbrc_alphavirus_genomes_reader) defined here so the broader
# pipeline can pull from them once Step 5/6 wiring lands. Unlinked
# in T01.

name: violin_bvbrc_workflow
description: "VIOLIN × BV-BRC entity-synonym workflow (first-release HARD-synonym variant)."
version: 0.1.0

steps:
  # -------- T01 vertical-slice chain (linked) --------

  entity_extraction:
    class: "apecx_integration.composition.steps.db_integration_wrappers.EntityExtractionStep"
    config: "steps/entity_extraction.yml"

  synonym_cache_lookup:
    class: "apecx_integration.composition.steps.synonym_cache.SynonymCacheLookupStep"
    config: "steps/synonym_cache_lookup.yml"

  synonym_llm_proposals:
    class: "apecx_integration.composition.steps.db_integration_wrappers.SynonymLLMProposalsStep"
    config: "steps/synonym_llm_proposals.yml"

  synonym_approval_gate:
    class: "nanobrain.library.steps.approval_step.ApprovalStep"
    config: "steps/synonym_approval_gate.yml"

  verified_synonym_writeback:
    class: "apecx_integration.composition.steps.synonym_cache.VerifiedSynonymWritebackStep"
    config: "steps/verified_synonym_writeback.yml"

  result_ranking:
    class: "nanobrain.library.workflows.viral_protein_analysis.steps.result_collection_step.ResultCollectionStep"
    config: "steps/result_ranking.yml"

  # -------- Loaded-but-unlinked steps (deferred for T01) --------

  bvbrc_snapshot_match:
    class: "nanobrain.library.workflows.viral_protein_analysis.steps.enhanced_bv_brc_data_acquisition_step.EnhancedBVBRCDataAcquisitionStep"
    config: "steps/bvbrc_snapshot_match.yml"

  violin_entity_lookup:
    class: "apecx_integration.composition.steps.db_integration_wrappers.ViolinEntityLookupStep"
    config: "steps/violin_entity_lookup.yml"

  genomic_annotation:
    class: "nanobrain.library.workflows.viral_protein_analysis.steps.bv_brc_data_acquisition_step.BVBRCDataAcquisitionStep"
    config: "steps/genomic_annotation.yml"

  violin_vaccine_reader:
    class: "apecx_integration.composition.steps.file_readers.DelimitedFileReaderStep"
    config: "steps/violin_vaccine_reader.yml"

  bvbrc_alphavirus_genomes_reader:
    class: "apecx_integration.composition.steps.file_readers.DelimitedFileReaderStep"
    config: "steps/bvbrc_alphavirus_genomes_reader.yml"

  # Day 2 v9 — final synthesis step. Loaded via from_config so the
  # workflow YAML carries it as a discoverable component; not on the
  # T01 link chain (see workflow header for rationale).
  rag_synthesis:
    class: "apecx_integration.composition.steps.rag_synthesis_step.RagSynthesisStep"
    config: "steps/rag_synthesis.yml"

# T01 vertical-slice link wiring.
#
# Each link is a DirectLink (no transformation). The contract bridging
# (Step 1 → Step 3a key shape, Step 4 → Step 4p key rename) is done
# in the producing/consuming Step bodies, NOT in the link.
#
# Historical context: at T04 ship time, nanobrain's ``TransformLink``
# had no YAML loader for its ``transform_function: str`` field, so
# link-side transformation wasn't possible from YAML at all. That gap
# is closed in nanobrain as of 2026-04-23 — ``TransformLink.from_config``
# now resolves dotted paths via ``parse_transform_from_config``. A
# working example lives at
# ``src/apecx_integration/composition/transforms.py`` +
# ``tests/integration/test_transforms_with_transformlink.py``.
#
# The T01 slice deliberately stays on the Step-body-bridging pattern
# because that pattern is already tested and shipped; rewriting it to
# use TransformLinks now would churn working code. Future workflows
# can choose link-side transformation when it's cleaner. See
# ``src/apecx_integration/composition/steps/data_unit_schemas.py`` for
# the full per-boundary shape specs.
links:

  step1_to_step3a:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: "direct"
      source: "entity_extraction.entity_candidates_output"
      target: "synonym_cache_lookup.query_terms_input"

  step3a_to_step3c:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: "direct"
      source: "synonym_cache_lookup.cache_lookup_output"
      target: "synonym_llm_proposals.novel_terms_input"

  step3c_to_step4:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: "direct"
      source: "synonym_llm_proposals.llm_proposals_output"
      target: "synonym_approval_gate.llm_proposals_input"

  step4_to_step4p:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: "direct"
      source: "synonym_approval_gate.approved_synonyms_output"
      target: "verified_synonym_writeback.approved_mappings_input"

  step4p_to_step7:
    class: "nanobrain.core.link.DirectLink"
    config:
      link_type: "direct"
      source: "verified_synonym_writeback.writeback_output"
      target: "result_ranking.enriched_results_input"
