# literature_rag step 2 — LiteratureRagStep
#
# Retrieves the top-k most relevant of the upstream ontology-filtered records for
# the question (sentence-transformers all-mpnet-base-v2, cosine top-k) and reuses
# the shared synthesize_response + its citation-against-inputs gate to produce a
# grounded, PMID-cited answer. The step OWNS its input/output data units + trigger
# (framework rule); the workflow owns the links between steps.

name: literature_rag_step
description: >
  Literature RAG answerer. Embeds the filtered records + question, retrieves the
  top-k, synthesizes a grounded Markdown answer with inline PMID citations.

input_data_units:
  rag_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: rag_input
    description: >
      ``{question: str, filtered_records: list[{pmid,title,abstract}]}`` — the
      question + filtered record set. Fed from ontology_filter_step via the
      filter_to_rag link.
    persistent: false

output_data_units:
  rag_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: rag_output
    description: >
      ``{answer: str, citations: list[str], status: str}`` — the answer envelope
      (status one of ok / no_evidence / synthesis_failed). Single output unit, so
      the framework writes the whole returned dict here.
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "rag_input"
