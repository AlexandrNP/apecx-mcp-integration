# literature_rag step 1 — OntologyFilterStep (TRUE NCBITaxon-IRI filter)
#
# Keeps only the input records stamped with a given target NCBITaxon IRI.
# Filtering is PURE over the provided input; organism->IRI RESOLUTION is a
# separate upstream concern. The step OWNS its input/output data units +
# trigger (framework rule); the workflow owns the links between steps.

name: ontology_filter_step
description: >
  NCBITaxon-IRI record filter. Keeps records whose stamped ``iris`` contain the
  envelope's ``target_iri``; degrades loud (status=no_target_iri) when the IRI
  is missing.

input_data_units:
  filter_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: filter_input
    description: >
      ``{stamped_records: list[dict], target_iri: str}`` — records each already
      stamped with an ``iris: list[str]`` field, plus the full NCBITaxon PURL to
      filter on. Fed from the workflow input via the input_to_filter link.
    persistent: false

output_data_units:
  filter_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: filter_output
    description: >
      ``{filtered_records: list, target_iri: str|null, status: str}`` — the
      filtered envelope. Single output unit, so the framework writes the whole
      returned dict here.
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "filter_input"
