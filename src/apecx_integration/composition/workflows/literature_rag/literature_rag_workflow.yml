# literature_rag workflow — ontology-filtered literature RAG (enrich-the-envelope cascade)
#
# Linear "enrich-the-envelope" cascade: ONE Workflow.run(input) flows
# organism -> IRI -> filtered papers -> cited answer. Each step passes the WHOLE
# envelope through, ENRICHED with its own output, so fields accumulate:
#
#   workflow_input  {organism, question, stamped_records}
#       │  (input_to_resolve)
#       ▼
#   resolve_organism_step   ← adds target_iri (organism -> NCBITaxon IRI)
#       │  {**envelope, target_iri}                (resolve_to_filter)
#       ▼
#   ontology_filter_step    ← adds filtered_records + status (keeps records
#       │                       stamped with target_iri)
#       │  {**envelope, filtered_records, status}  (filter_to_rag)
#       ▼
#   literature_rag_step     ← answers the question over the filtered set
#       │  {answer, citations, status}             (rag_to_output)
#       ▼
#   workflow_output

name: literature_rag_workflow
description: >
  Ontology-filtered literature RAG. Three steps: (0) resolve an organism name to a
  NCBITaxon IRI; (1) filter a stamped candidate record set to that IRI; (2)
  literature RAG answer over the filtered set. Each step enriches and forwards the
  whole envelope so the question survives from input to the reader.
version: 0.2.0

# Schema v2: DirectLink auto_transfer defaults to true. We ALSO declare
# auto_transfer: true explicitly on every link below — belt-and-suspenders against
# the dominant nanobrain silent-failure (a link that silently no-ops on
# auto_transfer=false, letting the workflow "load and run" while transferring nothing).
config_version: 2

# Workflow-level entry/exit ports. Required by the framework's integrity validator:
# every step input must have a source (workflow input OR an upstream step's output),
# and every step output must have a consumer. Without these bracketing links the
# workflow FAIL-FASTs at load.
input_data_units:
  workflow_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: workflow_input
    description: >
      ``{organism: str, question: str, stamped_records: list}`` — the organism to
      resolve, the scientist question, and the candidate records (each stamped with
      an ``iris: list[str]`` field). Forwarded to resolve_organism_step.resolve_input
      via input_to_resolve.
    persistent: false

output_data_units:
  workflow_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: workflow_output
    description: >
      ``{answer: str, citations: list, status: str}`` — the literature_rag_step answer
      envelope, received via the rag_to_output link.
    persistent: false

steps:
  resolve_organism_step:
    class: "apecx_integration.composition.workflows.literature_rag.steps.resolve_step.ResolveOrganismStep"
    config: "steps/resolve_step.yml"

  ontology_filter_step:
    class: "apecx_integration.composition.workflows.literature_rag.steps.ontology_filter_step.OntologyFilterStep"
    config: "steps/ontology_filter_step.yml"

  literature_rag_step:
    class: "apecx_integration.composition.workflows.literature_rag.steps.literature_rag_step.LiteratureRagStep"
    config: "steps/literature_rag_step.yml"

links:
  # ──────────────────────────────────────────────────────────────────
  # Every DirectLink MUST declare auto_transfer: true. Count of DirectLinks
  # below (4) MUST equal the count of auto_transfer: true (verified in the
  # smoke test and by scripts/lint_workflow_yamls.py).
  # ──────────────────────────────────────────────────────────────────

  input_to_resolve:
    class: "nanobrain.core.link.DirectLink"
    config:
      auto_transfer: true
      link_type: "direct"
      source: "workflow_input"
      target: "resolve_organism_step.resolve_input"

  resolve_to_filter:
    class: "nanobrain.core.link.DirectLink"
    config:
      auto_transfer: true
      link_type: "direct"
      source: "resolve_organism_step.resolve_output"
      target: "ontology_filter_step.filter_input"

  filter_to_rag:
    class: "nanobrain.core.link.DirectLink"
    config:
      auto_transfer: true
      link_type: "direct"
      source: "ontology_filter_step.filter_output"
      target: "literature_rag_step.rag_input"

  rag_to_output:
    class: "nanobrain.core.link.DirectLink"
    config:
      auto_transfer: true
      link_type: "direct"
      source: "literature_rag_step.rag_output"
      target: "workflow_output"
