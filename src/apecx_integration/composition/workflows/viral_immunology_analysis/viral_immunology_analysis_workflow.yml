# Comprehensive Viral Immunology Analysis Workflow
#
# Framework-compliant nanobrain workflow for analyzing any viral immunology research query.
# Replaces the hardcoded EEEV-only approach with proper workflow composition.
#
# Architecture:
#   query → classification → unlimited_assembly → synthesis → analysis
#
# Key features:
# - Virus-agnostic query classification
# - Unlimited data retrieval from all sources
# - Quality-based filtering instead of arbitrary caps
# - Proper nanobrain workflow patterns with auto_transfer links

name: "viral_immunology_analysis_workflow"
description: "Comprehensive viral immunology analysis for any virus family and research type"

# Workflow-level configuration
auto_initialize: true
debug_mode: false
enable_logging: true

# Workflow-level data units (entry/exit points)
input_data_units:
  workflow_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: "workflow_input"
    description: "Entry point - viral immunology research query"

output_data_units:
  workflow_output:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: "workflow_output"
    description: "Exit point - comprehensive analysis results"

# Workflow triggers
triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "workflow_input"

# Step definitions
steps:
  # Step 1: Viral Immunology Query Classification
  viral_classifier:
    class: "apecx_integration.composition.steps.viral_immunology_query_classifier_step.ViralImmunologyQueryClassifierStep"
    name: "viral_classifier"
    description: "Classify query for viral immunology research intent"

    # Configuration
    minimum_confidence: 0.3
    enable_fuzzy_matching: true
    ontology_config_path: null  # Use embedded default

    auto_initialize: true
    debug_mode: false
    enable_logging: true

    # Step data units
    input_data_units:
      classifier_input:
        class: "nanobrain.core.data_unit.DataUnitMemory"
        name: "classifier_input"
        description: "Raw query for classification"

    output_data_units:
      classifier_output:
        class: "nanobrain.core.data_unit.DataUnitMemory"
        name: "classifier_output"
        description: "Classification result with virus detection"

    # Step triggers
    triggers:
      - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
        data_unit: "classifier_input"

  # Step 2: Query Enhancement and Structuring
  query_enhancer:
    class: "apecx_integration.composition.steps.viral_query_enhancer_step.ViralQueryEnhancerStep"
    name: "query_enhancer"
    description: "Enhance query with classification results for better retrieval"

    auto_initialize: true
    debug_mode: false
    enable_logging: true

    input_data_units:
      enhancer_input:
        class: "nanobrain.core.data_unit.DataUnitMemory"
        name: "enhancer_input"
        description: "Query + classification results"

    output_data_units:
      enhancer_output:
        class: "nanobrain.core.data_unit.DataUnitMemory"
        name: "enhancer_output"
        description: "Enhanced query with entities and terms"

    triggers:
      - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
        data_unit: "enhancer_input"

  # Step 3: Unlimited Multi-Source Data Assembly
  unlimited_assembly:
    class: "apecx_integration.composition.steps.unlimited_synthesis_assembly_step.UnlimitedSynthesisAssemblyStep"
    name: "unlimited_assembly"
    description: "Unlimited retrieval from all data sources"

    # Enhanced retrieval configuration - NO ARBITRARY CAPS
    k_rag: 20  # Increased from default 5
    max_publications: 50  # Increased from default 5
    max_globus_hits: 100  # Increased from default 10

    # Quality filters instead of arbitrary limits
    min_violin_relevance_score: 0.1
    min_bvbrc_relevance_score: 0.1

    # Performance controls
    enable_streaming: false
    batch_size: 1000

    auto_initialize: true
    debug_mode: false
    enable_logging: true

    input_data_units:
      assembly_input:
        class: "nanobrain.core.data_unit.DataUnitMemory"
        name: "assembly_input"
        description: "Enhanced query for multi-source retrieval"

    output_data_units:
      synthesis_bundle_output:
        class: "nanobrain.core.data_unit.DataUnitMemory"
        name: "synthesis_bundle_output"
        description: "Complete data bundle from all sources"

    triggers:
      - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
        data_unit: "assembly_input"

  # Step 4: RAG Synthesis
  rag_synthesis:
    class: "apecx_integration.composition.steps.rag_synthesis_step.RagSynthesisStep"
    name: "rag_synthesis"
    description: "Synthesize comprehensive analysis from all retrieved data"

    # Use configuration from existing step
    config:
      path: "steps/rag_synthesis.yml"

    auto_initialize: true
    debug_mode: false
    enable_logging: true

    input_data_units:
      synthesis_input:
        class: "nanobrain.core.data_unit.DataUnitMemory"
        name: "synthesis_input"
        description: "Complete synthesis bundle"

    output_data_units:
      synthesis_output:
        class: "nanobrain.core.data_unit.DataUnitMemory"
        name: "synthesis_output"
        description: "Final analysis synthesis"

    triggers:
      - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
        data_unit: "synthesis_input"

# Workflow links (proper nanobrain data flow with auto_transfer)
step_links:
  # Entry: workflow_input → viral_classifier
  workflow_to_classifier:
    class: "nanobrain.core.link.DirectLink"
    name: "workflow_to_classifier"
    description: "Route workflow input to viral classifier"
    from_step: null  # workflow-level
    from_data_unit: "workflow_input"
    to_step: "viral_classifier"
    to_data_unit: "classifier_input"
    auto_transfer: true  # CRITICAL: prevents silent failure

  # Step 1 → Step 2: classification → query_enhancer
  classifier_to_enhancer:
    class: "nanobrain.core.link.DirectLink"
    name: "classifier_to_enhancer"
    description: "Pass classification to query enhancer"
    from_step: "viral_classifier"
    from_data_unit: "classifier_output"
    to_step: "query_enhancer"
    to_data_unit: "enhancer_input"
    auto_transfer: true

  # Step 2 → Step 3: enhanced query → unlimited_assembly
  enhancer_to_assembly:
    class: "nanobrain.core.link.DirectLink"
    name: "enhancer_to_assembly"
    description: "Pass enhanced query to unlimited assembly"
    from_step: "query_enhancer"
    from_data_unit: "enhancer_output"
    to_step: "unlimited_assembly"
    to_data_unit: "assembly_input"
    auto_transfer: true

  # Step 3 → Step 4: assembly → synthesis
  assembly_to_synthesis:
    class: "nanobrain.core.link.DirectLink"
    name: "assembly_to_synthesis"
    description: "Pass complete data bundle to synthesis"
    from_step: "unlimited_assembly"
    from_data_unit: "synthesis_bundle_output"
    to_step: "rag_synthesis"
    to_data_unit: "synthesis_input"
    auto_transfer: true

  # Exit: synthesis → workflow_output
  synthesis_to_workflow:
    class: "nanobrain.core.link.DirectLink"
    name: "synthesis_to_workflow"
    description: "Return final analysis to workflow output"
    from_step: "rag_synthesis"
    from_data_unit: "synthesis_output"
    to_step: null  # workflow-level
    to_data_unit: "workflow_output"
    auto_transfer: true

# Executor configuration (optional - inherits from workflow default)
executor:
  class: "nanobrain.core.executor.LocalExecutor"
  config:
    executor_type: "local"
    name: "viral_immunology_executor"
    max_workers: 4
    timeout: 300
