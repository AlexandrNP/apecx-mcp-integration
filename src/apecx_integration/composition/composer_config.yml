# T-COMP Phase 2 — sample composer config.
#
# Points at the prompt files + a component catalog + the T13 sandbox
# whitelist. All paths are relative to this config file's parent
# directory and get resolved by ``Composer.from_config``.
#
# LLM defaults match apecx_db_integration's APECX_LLM_* env-var
# contract — operator overrides via env vars at deploy time rather
# than editing this file.

library_version: "0.1.0-dev"
# COMPOSER TIER — intentionally separate from the synthesis default
# (apecx_integration.agents._llm_config.resolve_llm_model). The composer's
# structured-YAML codegen task was measured-best on these models, so it
# declares its own here (and per-role bindings below) rather than sharing
# the synthesis single-default. Operators running the composer pull these
# explicitly; `apecx-setup`'s single pull targets the synthesis model only.
llm_model: "mistral-small:latest"
llm_base_url: "http://localhost:11434/v1"

prompt_dir: "composer_prompts"

max_tokens: 4096
temperature: 0.0
# DEVELOPMENT DEFAULT — a transient LLM 5xx fails the entire
# compose request without retry. Production deployments should
# override to 2 or 3 via this file or APECX_LLM_MAX_RETRIES.
# Audit §5.2 (docs/codebase_audit_2026_04_24.md).
max_retries: 0

# Phase-2 additions: where to find components + novel-Python safety gate.
#
# ``component_catalog_paths`` is a list of T02-style manifest YAMLs.
# Each manifest's ``components:`` entries get flattened into the
# retrieval corpus. Add more lines as more workflows ship.
component_catalog_paths:
  - "workflows/rag_e2e_synthesis/manifest.yml"
  - "workflows/code_writing/manifest.yml"
  # Curated reusable reasoning patterns (tdr_loop, best_of_n, rag_e2e) exposed as
  # embeddable sub-steps via ReasoningPatternStep — so the composer can REUSE a
  # reasoning loop instead of re-authoring it.
  - "workflows/_reasoning_patterns/manifest.yml"

# ``sandbox_whitelist_path`` points at the T13 import whitelist. When
# set, any novel Python the LLM emits gets scanned before the
# composer returns. When null, the composer skips the scan — useful
# for tests that only exercise the YAML path. Production should ALWAYS
# set this.
sandbox_whitelist_path: "../_configs/import_whitelist.txt"

# How many catalog hits to surface to the LLM. Tight bound to keep
# the prompt readable — bumping past ~10 tends to confuse mistral-nemo.
retrieval_k: 10

# Per-role LLM endpoint bindings (CGU-P0, 2026-05-12).
#
# The composer codegen-uplift effort runs multi-stage scaffolds where
# different roles call different models — e.g. nemotron-3-nano (4B,
# thinking tokens) plans, mistral-nemo (12B) drafts. Each entry binds
# a role name to a model and optional base_url. ``base_url`` is
# inherited from ``llm_base_url`` when omitted.
#
# Roles consumed by the benchmark codegens (see
# tests/benchmarks/codegen/* and docs/composer_codegen_uplift_plan.md):
#   - ``drafter``  : emits the final code artifact
#   - ``planner``  : emits a numbered plan before drafting
#   - ``reviewer`` : critiques the drafter's output for review-revise
#
# Resolution order (per role, narrowest-wins):
#   1. explicit Python kwarg            (test override)
#   2. APECX_LLM_MODEL_<ROLE> env var   (operator override)
#   3. ``model_roles.<role>`` entry     (this file)
#   4. APECX_LLM_MODEL env var          (single-model fallback)
#   5. hardcoded role default           (codegen module)
model_roles:
  drafter:
    model: "mistral-nemo:latest"
  planner:
    model: "nemotron-3-nano:4b"
  reviewer:
    model: "nemotron-3-nano:4b"
