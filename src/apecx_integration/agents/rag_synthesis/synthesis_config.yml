# Synthesis configuration for the RAG-augmented response builder.
#
# Operator-tunable per deployment. The system_prompt is intentionally
# MINIMAL — synthesis is the LLM's job, not the prompt's. The prompt
# only declares what the citation markers look like (so the LLM can
# emit them) and invites a Markdown response. Everything else
# (length, structure, tone, depth) is left to the model.

system_prompt: |
  You are a research assistant for a vaccine and pathogen
  bioinformatics platform. The user has asked a question. The
  retrieved context below contains data from four sources:
  RAG semantic chunks, BV-BRC genome rows, VIOLIN cached
  mappings, and DataCite-shaped publications.

  Cite the data inline using these markers when you reference
  specific items: ``[RAG chunk #N]``, ``[BV-BRC genome <id>]``,
  ``[VIOLIN <id>]``, ``[<doi>]``. Respond in Markdown.

# How many of each source to surface. Defaults sized for a ~4K
# context budget on mistral-nemo:latest. Operators with larger
# context windows can raise these.
max_rag_chunks: 8
max_bvbrc_genomes: 5
max_violin_mappings: 20
max_publications: 5

# When the LLM produces a response with no inline citation
# markers, fail loudly rather than passing silently. The whole
# point of grounding the LLM in retrieved data is that it cites
# back to that data; a citation-free response is the silent-
# failure shape we're guarding against.
require_inline_citations: true

# Minimum number of DISTINCT citation tokens. Deduplicated by
# exact token text — citing the same source N times counts once.
# 1 = "any citation will do" (preserves prior behavior).
# 2+ = forces multi-source grounding (recommended for prod).
min_distinct_citations: 1

# Patterns matching INLINE CITATION TOKENS. Each pattern matches
# a complete citation (not a prefix), so the validator can extract
# distinct tokens — not just check whether any pattern appears
# anywhere. A prefix pattern ``\[BV-BRC genome `` would let the
# LLM emit ``[BV-BRC genome ?]`` and pass; the tightened pattern
# ``\[BV-BRC genome [^\]]+\]`` requires the citation to close,
# but does NOT validate the inner ID — that's the renderer's job
# (strict_input_validation rejects rows with no id upstream).
citation_marker_patterns:
  # Tightened post-probe 1066 (2026-04-27): inner class excludes
  # closing bracket, whitespace, AND opening bracket to prevent the
  # greedy-match-across-tokens shape (e.g. an interrupted
  # ``[10.1234/abc...`` followed by a later ``[10.5/y]``).
  - '\[BV-BRC genome [^\]\s\[]+\]'
  - '\[VIOLIN [^\]\s\[]+\]'
  - '\[RAG chunk #\d+\]'
  - '\[10\.[0-9]+/[^\]\s\[]+\]'

# Minimum length of the LLM response. Below this floor the
# response is rejected as curtailed (per user directive
# 2026-04-27 — "responses should be non-trivial and not
# curtailed"). Set to 0 to disable for unit-test fixtures.
min_response_chars: 200

# Fail BEFORE invoking the LLM when every retrieval input is
# empty. The synthesis is grounded in retrieved data; with no
# data the LLM can only confabulate, and the citation validator
# would fail downstream with an error pointing at the wrong
# cause. Promote the failure to its true root.
fail_on_empty_retrieval: true

# Reject input rows missing essential fields (genome_id /
# canonical_term / chunk text / DOI for publications) BEFORE
# rendering. Closes a silent-failure shape: a row with no id
# rendered as ``[BV-BRC genome ?]`` would let the LLM cite ``?``
# past the validator. Operators with dirty data set this False
# to skip-with-warning instead.
strict_input_validation: true

# Cross-check that every distinct citation token the LLM emits
# corresponds to an ID actually rendered into the prompt. Closes
# the last silent-failure shape: an LLM hallucinating a
# plausibly-shaped ID like ``[BV-BRC genome 99999.99]`` (when
# 99999.99 was never in the inputs) currently passes the regex-
# only validator. With this on, each renderer reports the set of
# tokens it authorized; the validator unions them and rejects any
# extracted token outside the union. Disable ONLY if your caller
# deliberately allows LLM citations beyond the supplied retrieval
# bundle (rare; usually a smell).
validate_citations_against_inputs: true
