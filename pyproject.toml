[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apecx-integration"
version = "0.0.1"
description = "APECx MCP + Control Plane + Composition + Execution integration (Tier 1–4)"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "APECx team"}]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "mcp>=0.9",
    "anthropic>=0.34",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]
rag = [
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.8",
]
hpc = [
    "globus-compute-sdk>=2.20",
    "globus-sdk>=3.40",
]

[project.scripts]
apecx-cp = "apecx_integration.control_plane.app:main"
apecx-mcp = "apecx_integration.mcp_surface.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit real data / real external systems (workspace policy)",
    "smoke: fast wiring-shape tests; mocks permitted per workspace policy",
    "slow: tests >30s",
]
asyncio_mode = "auto"
