[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apecx-integration"
version = "0.0.1"
description = "APECx MCP + Control Plane + Composition + Execution integration (Tier 1–4)"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "Proprietary — All Rights Reserved (see LICENSE)"}
authors = [{name = "APECx team"}]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "mcp>=0.9",
    "anthropic>=0.34",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # OpenAI client library — required because nanobrain's Agent
    # unconditionally imports it, and our composition steps use nanobrain
    # Agents (e.g., SynonymDetectionAgent wired in Step 2). Also serves
    # the Ollama/vLLM path per scope memo 07, since both expose an
    # OpenAI-compatible chat-completions endpoint.
    "openai>=1.0",
    # Postgres driver: required when APECX_CP_DB_URL points at Postgres
    # (local managed container or BYO). The `binary` extra bundles libpq
    # so there is no system dependency on macOS / Linux / CI. Pure-SQLite
    # deployments never import psycopg at runtime; the dep cost is just
    # ~5MB of wheel on install.
    "psycopg[binary]>=3.1",
    # Migrated from apecx-db-integration (2026-04-27, user directive
    # "this repo should only depend on nanobrain and apecx-harvesters").
    # The violin_bvbrc agents need pandas for VIOLIN dataframe loading
    # and the langchain-* family for the OpenAI-compatible chat client.
    "pandas>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    # Sibling repos installed directly from git so a single
    # ``pipx install git+...apecx-mcp-integration`` brings the whole
    # tree. Workspace policy (CLAUDE.md): this repo's only
    # sibling-repo runtime deps are nanobrain + apecx-harvesters.
    # Branch refs are pinned for reproducibility — bump explicitly
    # when upstream lands a feature this repo depends on.
    "nanobrain @ git+https://github.com/AlexandrNP/nanobrain.git@academy-integration",
    "apecx-harvesters @ git+https://github.com/abought/apecx-harvesters.git@main",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    # In-process SMTP server for EmailNotifier integration tests (T08).
    # No production code imports it; dev-only.
    "aiosmtpd>=1.4",
]
rag = [
    # Upper bound matches nanobrain's pin; sentence-transformers 3.x
    # would require coordinated upgrades across both repos. See audit
    # finding §8.3 (docs/codebase_audit_2026_04_24.md).
    "sentence-transformers>=2.7,<3.0.0",
    "faiss-cpu>=1.8",
]
hpc = [
    "globus-compute-sdk>=2.20",
    "globus-sdk>=3.40",
]
# G5 (2026-04-24): academy-py is the Academy agent framework that
# nanobrain's AcademyManagerWrapper / AcademyLink / AcademyAgentStep
# dispatch through. Before G5 the real path raised
# AcademyNotImplementedError; it is now an exercised integration
# covered by tests/integration/test_academy_real_integration.py.
# Pinned to >=0.4 because the canonical
# ``Manager.from_exchange_factory`` entry point lives there.
academy = [
    "academy-py>=0.4",
]

[project.scripts]
# Console scripts ship intentional, user-facing entry points only.
# The dictionary-build pipeline is exposed as a nanobrain workflow
# (see apecx_integration.synonym_dictionary.workflow.bootstrap.ensure_dictionary)
# rather than standalone executables — apecx-mcp invokes it lazily at startup.
apecx-cp = "apecx_integration.control_plane.app:main"
apecx-mcp = "apecx_integration.mcp_surface.server:main"
apecx-setup = "apecx_integration.cli.setup_data:main"

[tool.setuptools.packages.find]
where = ["src"]

# Ship every config-shaped resource under apecx_integration/ inside the
# wheel so ``apecx-mcp`` / ``apecx-cp`` work from any install mode
# (uv tool / pipx / pip --user) without needing the repo root on disk.
#
# Why recursive globs (``**/*.yml`` etc.) instead of per-directory
# enumeration: every time someone added a new workflow YAML to a fresh
# subdirectory, the per-directory list silently failed to include it.
# The wheel built fine; the install copy was missing files; the crash
# only surfaced at runtime when the missing YAML was actually loaded.
# That bit us with ``rag_e2e_synthesis/manifest.yml`` (2026-05-06).
#
# A regression test (``tests/unit/test_package_data_complete.py``)
# walks ``src/apecx_integration/`` for YAML/MD/INI files and asserts
# each one is covered by some pattern below. If you add a new file
# extension that needs to ship, add it both here AND in the test's
# ``EXPECTED_RESOURCE_EXTS`` set.
[tool.setuptools.package-data]
apecx_integration = [
    "**/*.yml",
    "**/*.yaml",
    "**/*.md",
    "**/*.ini",
    "**/*.txt",
    "_alembic/migrations/versions/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that hit real data / real external systems (workspace policy)",
    "smoke: fast wiring-shape tests; mocks permitted per workspace policy",
    "unit: fast, in-process tests of a pure function or narrow component",
    "slow: tests >30s",
]
asyncio_mode = "auto"
