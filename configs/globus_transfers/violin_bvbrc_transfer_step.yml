# GlobusTransferStep wrapper for the VIOLIN + BV-BRC dataset (G82, 2026-05-16)
# Updated G90 (2026-05-17): supports BOTH client_credentials and native auth modes.
#
# Source-of-truth: the dataset lives on the "APECx Data at Argonne LCF"
# Globus collection (UUID supplied via $APECX_GLOBUS_SOURCE_ENDPOINT_ID
# — never hardcoded here). Re-mapped 2026-05-21: BV-BRC under
# /apecx-ramanathan-anl/public/data/BV-BRC/ (live-verified) and VIOLIN under
# /apecx-ramanathan-anl/apecx-project-all/ (per the data steward). Both source
# roots + the per-file paths are built by
# cli/_globus_data_transfer.py:build_transfer_items and validated by the
# verify step before transfer — see that module for the authoritative layout.
#
# Why env vars (not the YAML)?
#   * The test endpoint UUID is operator-specific; checking it in would
#     leak a per-user identifier into every clone.
#   * Different operators (dev / CI / production) point at different
#     endpoints; the wrapper YAML stays identical across deployments.
#
# Transfer ITEMS (which files to move) are NOT in this config. They are
# supplied at runtime via ``process(input_data={"items": [...]})``
# because the destination paths depend on the operator's chosen data
# directory (``apecx-setup data`` prompts for it; the default is
# ``~/.apecx/data``). See ``cli/_globus_data_transfer.py:build_transfer_items``
# for the items-building logic.
#
# Auth modes (default flipped 2026-05-21)
# ---------------------------------------
# Two supported via the ${APECX_GLOBUS_AUTH_MODE} env var:
#
#   native (DEFAULT) — interactive browser-based device-code flow against a
#     native ("thick") app. No secret. The native-app client_id has a built-in
#     default (override via ${APECX_GLOBUS_NATIVE_CLIENT_ID}); tokens are
#     persisted by a prior ``apecx-globus-setup login`` and loaded by
#     globus_sdk.UserApp at workflow run time.
#
#   client_credentials (OPT-IN) — confidential ("thin") machine-to-machine
#     auth. For CI / automation / Aurora HPC / headless installs (the device
#     flow needs a browser). Select with APECX_GLOBUS_AUTH_MODE=client_credentials;
#     requires ${GLOBUS_COMPUTE_CLIENT_ID} + ${GLOBUS_COMPUTE_CLIENT_SECRET} in
#     env or stored via ``apecx-globus-setup store``.
#
# The default-form ``${VAR:-}`` for the resolved-credential fields lets the
# YAML load under either mode.

name: violin_bvbrc_globus_transfer
description: |
  Transfer the VIOLIN + BV-BRC dataset (6 CSV files) from the
  "APECx Data at Argonne LCF" Globus collection to the operator's
  local Globus endpoint. Supports both confidential-client and
  native-app auth modes.
class: nanobrain.library.steps.globus_transfer_step.GlobusTransferStep

# Endpoint UUIDs — REQUIRED at workflow load time; the absence of
# either fails fast at config validation.
source_endpoint_id: "${APECX_GLOBUS_SOURCE_ENDPOINT_ID}"
dest_endpoint_id: "${APECX_GLOBUS_DEST_ENDPOINT_ID}"

# Auth mode selector. Default is native (web/device-code login); operators
# opt into the confidential secret path with APECX_GLOBUS_AUTH_MODE=client_credentials.
auth_mode: "${APECX_GLOBUS_AUTH_MODE:-native}"

# Resolved auth credentials. Apecx-side code populates these
# (``_globus_data_transfer.py:_resolve_auth_env``) based on which
# auth_mode is selected — it sets either the native-app UUID or the
# confidential client_id/secret pair before loading this YAML.
# Single source of truth: no nested interpolation here because
# nanobrain's env-var parser doesn't support ``${A:-${B}}`` nesting
# (the inner substitution succeeds but the outer ``}`` survives
# literally, producing broken values like ``uuid}``).
client_id: "${APECX_GLOBUS_RESOLVED_CLIENT_ID:-}"
client_secret: "${APECX_GLOBUS_RESOLVED_CLIENT_SECRET:-}"

# checksum is the safest sync mode (compares file contents, not just
# size/mtime). The dataset is small (the curated BV-BRC alphavirus file is
# ~12 MB; the VIOLIN CSVs are a few MB total) so the checksum overhead is
# negligible.
sync_level: checksum
verify_checksum: true

# Poll timeout is generous mainly to absorb Globus-side QUEUEING (a transfer
# can wait behind other tasks on the source endpoint), not raw wire time —
# the whole dataset is well under 20 MB and transfers in seconds once it
# starts. 1800 s (30 min) is comfortable headroom; the step FAILS LOUD if a
# transfer doesn't reach a terminal state within it.
poll_timeout_seconds: 1800.0
poll_interval_seconds: 5.0

transfer_label: apecx-setup-violin-bvbrc

# ---------------------------------------------------------------------------
# Workflow-cascade wiring (G127). These data units + trigger are REQUIRED when
# this step runs inside violin_bvbrc_transfer_workflow.yml: the verify_to_transfer
# link targets ``transfer.transfer_input``, and the trigger fires process() when
# the verified manifest arrives. They are INERT on the direct-call path
# (``GlobusTransferStep.from_config(...).process({"items": ...})``), which
# bypasses the trigger system entirely — kept here so a single config serves
# both the workflow and any direct caller (no duplication).
# ---------------------------------------------------------------------------
input_data_units:
  transfer_input:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: transfer_input
    description: >
      ``{items: [{source_path, dest_path}, ...]}`` — the verified manifest
      handed over by the verify step via the verify_to_transfer link. The
      step's envelope-unwrap turns ``{transfer_input: {items: [...]}}`` back
      into ``{items: [...]}``.
    persistent: false

output_data_units:
  status:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: status
    description: "Globus terminal status string ('SUCCEEDED')."
    persistent: false
  task_id:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: task_id
    description: "Globus transfer task UUID."
    persistent: false
  items_transferred:
    class: "nanobrain.core.data_unit.DataUnitMemory"
    name: items_transferred
    description: "Count of items transferred."
    persistent: false

triggers:
  - class: "nanobrain.core.trigger.DataUnitChangeTrigger"
    data_unit: "transfer_input"
