components:
  schemas:
    Approval:
      additionalProperties: false
      properties:
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        decided_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Decided At
        decided_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Decided By
        id:
          format: uuid
          title: Id
          type: string
        kind:
          $ref: '#/components/schemas/ApprovalKind'
        policy:
          additionalProperties: true
          title: Policy
          type: object
        status:
          $ref: '#/components/schemas/ApprovalStatus'
          default: pending
        step_id:
          format: uuid
          title: Step Id
          type: string
      required:
      - step_id
      - kind
      title: Approval
      type: object
    ApprovalKind:
      enum:
      - hard
      - soft
      - silent
      - allocation
      title: ApprovalKind
      type: string
    ApprovalMetricsResponse:
      additionalProperties: false
      description: "Aggregate telemetry over approval decisions in a time window.\n\
        \nRubber-stamping detection (AP \xA77 risk #4): if median time-to-decide\n\
        drops below 5 seconds across a week with N>5 approvals, the reviewer\nis likely\
        \ not reading \u2014 ``rubber_stamping_suspected`` becomes true.\nDocument\
        \ the threshold so it's checked at retros (TX3 AC4)."
      properties:
        count:
          description: Approvals with both started and decided timestamps in the window.
          minimum: 0.0
          title: Count
          type: integer
        median_time_to_decide_seconds:
          anyOf:
          - type: number
          - type: 'null'
          description: Median seconds between APPROVAL_REQUESTED and APPROVAL_DECIDED.
            Null when count==0.
          title: Median Time To Decide Seconds
        p95_time_to_decide_seconds:
          anyOf:
          - type: number
          - type: 'null'
          description: 95th-percentile time-to-decide. Null when count < 20 (statistic
            is meaningless below that sample size).
          title: P95 Time To Decide Seconds
        percent_auto_approved:
          description: Share of decisions with final status AUTO_APPROVED. Always
            0 when count==0.
          maximum: 100.0
          minimum: 0.0
          title: Percent Auto Approved
          type: number
        percent_rejected:
          description: Share of decisions with final status REJECTED. Always 0 when
            count==0.
          maximum: 100.0
          minimum: 0.0
          title: Percent Rejected
          type: number
        rubber_stamping_suspected:
          description: True when count>5 and median_time_to_decide_seconds<5.
          title: Rubber Stamping Suspected
          type: boolean
        window_start_iso:
          description: Caller-supplied `since` timestamp, echoed.
          title: Window Start Iso
          type: string
      required:
      - count
      - median_time_to_decide_seconds
      - p95_time_to_decide_seconds
      - percent_auto_approved
      - percent_rejected
      - rubber_stamping_suspected
      - window_start_iso
      title: ApprovalMetricsResponse
      type: object
    ApprovalResponse:
      additionalProperties: false
      properties:
        approval:
          $ref: '#/components/schemas/Approval'
      required:
      - approval
      title: ApprovalResponse
      type: object
    ApprovalStatus:
      enum:
      - pending
      - approved
      - approved_with_modifications
      - rejected
      - auto_approved
      - timed_out
      title: ApprovalStatus
      type: string
    ApproveRequest:
      additionalProperties: false
      properties:
        approval_id:
          format: uuid
          title: Approval Id
          type: string
        comment:
          default: ''
          title: Comment
          type: string
        decided_by:
          default: api_user
          title: Decided By
          type: string
      required:
      - approval_id
      title: ApproveRequest
      type: object
    Artifact:
      additionalProperties: false
      properties:
        content_hash:
          pattern: ^[0-9a-f]{64}$
          title: Content Hash
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        kind:
          $ref: '#/components/schemas/ArtifactKind'
        location:
          title: Location
          type: string
        mime_type:
          title: Mime Type
          type: string
        run_id:
          format: uuid
          title: Run Id
          type: string
        size_bytes:
          minimum: 0.0
          title: Size Bytes
          type: integer
        step_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Step Id
      required:
      - run_id
      - kind
      - location
      - content_hash
      - size_bytes
      - mime_type
      - created_at
      title: Artifact
      type: object
    ArtifactKind:
      enum:
      - input
      - intermediate
      - output
      - generated_workflow
      - generated_python
      title: ArtifactKind
      type: string
    ConfirmAllocationRequest:
      additionalProperties: false
      properties:
        confirmed_core_hours:
          minimum: 0.0
          title: Confirmed Core Hours
          type: number
        run_id:
          format: uuid
          title: Run Id
          type: string
      required:
      - run_id
      - confirmed_core_hours
      title: ConfirmAllocationRequest
      type: object
    ConfirmAllocationResponse:
      additionalProperties: false
      properties:
        confirmed:
          title: Confirmed
          type: boolean
        run_id:
          format: uuid
          title: Run Id
          type: string
      required:
      - run_id
      - confirmed
      title: ConfirmAllocationResponse
      type: object
    CorrectRequest:
      additionalProperties: false
      properties:
        approval_id:
          format: uuid
          title: Approval Id
          type: string
        decided_by:
          default: api_user
          title: Decided By
          type: string
        modifications:
          additionalProperties: true
          title: Modifications
          type: object
      required:
      - approval_id
      - modifications
      title: CorrectRequest
      type: object
    CreateApprovalRequest:
      additionalProperties: false
      properties:
        artifact_ids:
          items:
            format: uuid
            type: string
          title: Artifact Ids
          type: array
        kind:
          $ref: '#/components/schemas/ApprovalKind'
        policy:
          additionalProperties: true
          title: Policy
          type: object
        run_id:
          format: uuid
          title: Run Id
          type: string
        step_id:
          format: uuid
          title: Step Id
          type: string
        summary:
          title: Summary
          type: string
      required:
      - run_id
      - step_id
      - kind
      - summary
      title: CreateApprovalRequest
      type: object
    CreateApprovalResponse:
      additionalProperties: false
      properties:
        approval:
          $ref: '#/components/schemas/Approval'
      required:
      - approval
      title: CreateApprovalResponse
      type: object
    CreateVerifiedSynonymRequest:
      additionalProperties: false
      description: 'Write-back after ApprovalStep approves a novel mapping.


        ``verified_by`` is the reviewer''s identifier (same placeholder shape

        as ApprovalStep''s ``decided_by``: defaults to ``"api_user"`` until

        auth lands).'
      properties:
        canonical_term:
          minLength: 1
          title: Canonical Term
          type: string
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        query_term:
          minLength: 1
          title: Query Term
          type: string
        scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Scope
        source_run_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Source Run Id
        source_vocabulary:
          minLength: 1
          title: Source Vocabulary
          type: string
        target_vocabulary:
          minLength: 1
          title: Target Vocabulary
          type: string
        verified_by:
          default: api_user
          title: Verified By
          type: string
      required:
      - source_vocabulary
      - query_term
      - target_vocabulary
      - canonical_term
      - confidence
      title: CreateVerifiedSynonymRequest
      type: object
    EstimateCostRequest:
      additionalProperties: false
      properties:
        run_id:
          format: uuid
          title: Run Id
          type: string
      required:
      - run_id
      title: EstimateCostRequest
      type: object
    EstimateCostResponse:
      additionalProperties: false
      properties:
        confidence_interval:
          maxItems: 2
          minItems: 2
          prefixItems:
          - type: number
          - type: number
          title: Confidence Interval
          type: array
        endpoint:
          title: Endpoint
          type: string
        novel_python_capped_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Novel Python Capped At
        per_step_core_hours:
          additionalProperties:
            type: number
          title: Per Step Core Hours
          type: object
        total_core_hours:
          minimum: 0.0
          title: Total Core Hours
          type: number
      required:
      - total_core_hours
      - per_step_core_hours
      - confidence_interval
      - endpoint
      title: EstimateCostResponse
      type: object
    ExecutorKind:
      enum:
      - local
      - globus_compute
      - pbs_bundle
      title: ExecutorKind
      type: string
    ExportHpcBundleRequest:
      additionalProperties: false
      properties:
        output_directory:
          title: Output Directory
          type: string
        run_id:
          format: uuid
          title: Run Id
          type: string
        target_system:
          title: Target System
          type: string
      required:
      - run_id
      - target_system
      - output_directory
      title: ExportHpcBundleRequest
      type: object
    ExportHpcBundleResponse:
      additionalProperties: false
      properties:
        bundle_path:
          title: Bundle Path
          type: string
        submit_command:
          title: Submit Command
          type: string
      required:
      - bundle_path
      - submit_command
      title: ExportHpcBundleResponse
      type: object
    GeneratePlanRequest:
      additionalProperties: false
      properties:
        description:
          minLength: 1
          title: Description
          type: string
        library_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Library Version
      required:
      - description
      title: GeneratePlanRequest
      type: object
    GeneratePlanResponse:
      additionalProperties: false
      properties:
        generated_artifact_id:
          format: uuid
          title: Generated Artifact Id
          type: string
        plan:
          items:
            $ref: '#/components/schemas/StepPlan'
          title: Plan
          type: array
        yaml_text:
          title: Yaml Text
          type: string
      required:
      - plan
      - yaml_text
      - generated_artifact_id
      title: GeneratePlanResponse
      type: object
    GetArtifactRequest:
      additionalProperties: false
      properties:
        artifact_id:
          format: uuid
          title: Artifact Id
          type: string
      required:
      - artifact_id
      title: GetArtifactRequest
      type: object
    GetArtifactResponse:
      additionalProperties: false
      properties:
        artifact:
          $ref: '#/components/schemas/Artifact'
        inline_bytes:
          anyOf:
          - contentMediaType: application/octet-stream
            type: string
          - type: 'null'
          title: Inline Bytes
        reason_inline_omitted:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason Inline Omitted
      required:
      - artifact
      title: GetArtifactResponse
      type: object
    GetStatusRequest:
      additionalProperties: false
      properties:
        run_id:
          format: uuid
          title: Run Id
          type: string
      required:
      - run_id
      title: GetStatusRequest
      type: object
    GetStatusResponse:
      additionalProperties: false
      properties:
        pending_approval:
          anyOf:
          - $ref: '#/components/schemas/Approval'
          - type: 'null'
        run:
          $ref: '#/components/schemas/Run'
        steps:
          items:
            $ref: '#/components/schemas/Step'
          title: Steps
          type: array
      required:
      - run
      - steps
      title: GetStatusResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    ListPendingApprovalsRequest:
      additionalProperties: false
      properties:
        user_id:
          title: User Id
          type: string
      required:
      - user_id
      title: ListPendingApprovalsRequest
      type: object
    ListPendingApprovalsResponse:
      additionalProperties: false
      properties:
        approvals:
          items:
            $ref: '#/components/schemas/Approval'
          title: Approvals
          type: array
      required:
      - approvals
      title: ListPendingApprovalsResponse
      type: object
    ListRunsRequest:
      additionalProperties: false
      properties:
        limit:
          default: 50
          maximum: 500.0
          minimum: 1.0
          title: Limit
          type: integer
        status_filter:
          anyOf:
          - $ref: '#/components/schemas/RunStatus'
          - type: 'null'
        user_id:
          title: User Id
          type: string
      required:
      - user_id
      title: ListRunsRequest
      type: object
    ListRunsResponse:
      additionalProperties: false
      properties:
        runs:
          items:
            $ref: '#/components/schemas/Run'
          title: Runs
          type: array
      required:
      - runs
      title: ListRunsResponse
      type: object
    RejectRequest:
      additionalProperties: false
      properties:
        approval_id:
          format: uuid
          title: Approval Id
          type: string
        decided_by:
          default: api_user
          title: Decided By
          type: string
        reason:
          minLength: 1
          title: Reason
          type: string
      required:
      - approval_id
      - reason
      title: RejectRequest
      type: object
    RevokeVerifiedSynonymRequest:
      additionalProperties: false
      description: 'Soft-delete a previously-approved mapping. Row is preserved for

        audit; ``is_active`` flips to false and the revocation fields are

        populated. Optional ``superseded_by`` points at a replacement row.'
      properties:
        revocation_reason:
          minLength: 1
          title: Revocation Reason
          type: string
        revoked_by:
          default: api_user
          title: Revoked By
          type: string
        superseded_by:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Superseded By
      required:
      - revocation_reason
      title: RevokeVerifiedSynonymRequest
      type: object
    Run:
      additionalProperties: false
      properties:
        completed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Completed At
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          format: uuid
          title: Id
          type: string
        parent_run_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Parent Run Id
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Started At
        status:
          $ref: '#/components/schemas/RunStatus'
          default: pending
        user_id:
          title: User Id
          type: string
        workflow_config_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Workflow Config Id
      required:
      - user_id
      - created_at
      title: Run
      type: object
    RunStatus:
      enum:
      - pending
      - running
      - paused
      - completed
      - failed
      - cancelled
      title: RunStatus
      type: string
    ShowYamlDiffRequest:
      additionalProperties: false
      properties:
        run_id:
          format: uuid
          title: Run Id
          type: string
      required:
      - run_id
      title: ShowYamlDiffRequest
      type: object
    ShowYamlDiffResponse:
      additionalProperties: false
      properties:
        categorization:
          items:
            $ref: '#/components/schemas/StepPlan'
          title: Categorization
          type: array
        novel_python_by_step:
          additionalProperties:
            type: string
          title: Novel Python By Step
          type: object
        summary_sentence:
          title: Summary Sentence
          type: string
        yaml_text:
          title: Yaml Text
          type: string
      required:
      - yaml_text
      - categorization
      - summary_sentence
      title: ShowYamlDiffResponse
      type: object
    StartWorkflowRequest:
      additionalProperties: false
      properties:
        description:
          minLength: 1
          title: Description
          type: string
        preferred_executor:
          $ref: '#/components/schemas/ExecutorKind'
          default: local
        user_id:
          title: User Id
          type: string
      required:
      - description
      - user_id
      title: StartWorkflowRequest
      type: object
    StartWorkflowResponse:
      additionalProperties: false
      properties:
        generated_workflow_artifact_id:
          format: uuid
          title: Generated Workflow Artifact Id
          type: string
        run:
          $ref: '#/components/schemas/Run'
      required:
      - run
      - generated_workflow_artifact_id
      title: StartWorkflowResponse
      type: object
    Step:
      additionalProperties: false
      properties:
        completed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Completed At
        executor:
          $ref: '#/components/schemas/ExecutorKind'
          default: local
        id:
          format: uuid
          title: Id
          type: string
        input_artifact_ids:
          items:
            format: uuid
            type: string
          title: Input Artifact Ids
          type: array
        log_location:
          anyOf:
          - type: string
          - type: 'null'
          title: Log Location
        output_artifact_ids:
          items:
            format: uuid
            type: string
          title: Output Artifact Ids
          type: array
        run_id:
          format: uuid
          title: Run Id
          type: string
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Started At
        status:
          $ref: '#/components/schemas/StepStatus'
          default: pending
        step_name:
          title: Step Name
          type: string
      required:
      - run_id
      - step_name
      title: Step
      type: object
    StepCategory:
      description: "Disposition category from the differential-review UX (T06).\n\n\
        See architectural_plan.md \xA75.6."
      enum:
      - composed_standard
      - composed_parameterized
      - composed_wrapped
      - novel
      title: StepCategory
      type: string
    StepPlan:
      additionalProperties: false
      properties:
        category:
          $ref: '#/components/schemas/StepCategory'
        rationale:
          title: Rationale
          type: string
        reference_component_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference Component Id
        step_id:
          title: Step Id
          type: string
        step_name:
          title: Step Name
          type: string
      required:
      - step_id
      - step_name
      - category
      - rationale
      title: StepPlan
      type: object
    StepStatus:
      enum:
      - pending
      - running
      - paused_for_approval
      - completed
      - failed
      - skipped
      title: StepStatus
      type: string
    SubmitHpcRequest:
      additionalProperties: false
      properties:
        allocation_account:
          anyOf:
          - type: string
          - type: 'null'
          title: Allocation Account
        executor:
          $ref: '#/components/schemas/ExecutorKind'
        run_id:
          format: uuid
          title: Run Id
          type: string
      required:
      - run_id
      - executor
      title: SubmitHpcRequest
      type: object
    SubmitHpcResponse:
      additionalProperties: false
      properties:
        external_job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Job Id
        run_id:
          format: uuid
          title: Run Id
          type: string
        submitted_executor:
          $ref: '#/components/schemas/ExecutorKind'
      required:
      - run_id
      - submitted_executor
      title: SubmitHpcResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VerifiedSynonym:
      additionalProperties: false
      description: "A user-verified synonym mapping persisted across runs.\n\nRound\
        \ 3 addition (user directive 2026-04-21): instead of asking a human to\napprove\
        \ the same synonym on every run, we remember past approvals and only\nsurface\
        \ novel terms to the HITL gate.\n\nNaming conventions:\n- ``source_vocabulary``:\
        \ which corpus the query term came from, e.g.\n  ``user_query``, ``violin.vaccine_name``,\
        \ ``bvbrc.strain_name``.\n- ``target_vocabulary``: where the canonical term\
        \ lives, e.g.\n  ``violin.pathogen_id``, ``bvbrc.genome_id``.\n- ``canonical_term``:\
        \ the resolved identifier (may be an ID or a name\n   string, depending on\
        \ the target vocabulary).\n- ``scope``: optional narrowing, e.g. restrict\
        \ a mapping to a specific\n  taxonomic family or dataset version.\n\nRevocation\
        \ (user directive 2026-04-21, workflow_spec v2 open question 5):\na previously-verified\
        \ mapping can be revoked when a user discovers it was\nincorrect. Revoked\
        \ rows are NOT deleted \u2014 they stay for audit. The cache\nlookup in Step\
        \ 3a filters by ``is_active``. Revocation is recorded as a\nstate transition,\
        \ not a hard delete, so provenance remains intact.\n\nThe same query term\
        \ may have multiple verified mappings with different\n``target_vocabulary``\
        \ values (one per corpus). Uniqueness is intended at\nthe ``(source_vocabulary,\
        \ query_term, target_vocabulary, scope, is_active)``\ntuple level; the T09\
        \ migration will enforce that *active* mappings are\nunique but allow historical\
        \ revoked rows to coexist."
      properties:
        canonical_term:
          title: Canonical Term
          type: string
        comment:
          anyOf:
          - type: string
          - type: 'null'
          title: Comment
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        id:
          format: uuid
          title: Id
          type: string
        is_active:
          default: true
          title: Is Active
          type: boolean
        query_term:
          title: Query Term
          type: string
        revocation_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Revocation Reason
        revoked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Revoked At
        revoked_by:
          anyOf:
          - type: string
          - type: 'null'
          title: Revoked By
        scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Scope
        source_run_id:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Source Run Id
        source_vocabulary:
          title: Source Vocabulary
          type: string
        superseded_by:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Superseded By
        target_vocabulary:
          title: Target Vocabulary
          type: string
        verified_at:
          format: date-time
          title: Verified At
          type: string
        verified_by:
          title: Verified By
          type: string
      required:
      - source_vocabulary
      - query_term
      - target_vocabulary
      - canonical_term
      - verified_by
      - verified_at
      - confidence
      title: VerifiedSynonym
      type: object
    VerifiedSynonymLookupRequest:
      additionalProperties: false
      description: 'Batched cache lookup. Every workflow run starts with a lookup

        for the entity terms it extracted from the user query; this is

        the hot path for HARD-synonym strategy, so the API is batched.'
      properties:
        query_terms:
          items:
            type: string
          maxItems: 500
          minItems: 1
          title: Query Terms
          type: array
        scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Scope
        source_vocabulary:
          minLength: 1
          title: Source Vocabulary
          type: string
        target_vocabulary:
          minLength: 1
          title: Target Vocabulary
          type: string
      required:
      - source_vocabulary
      - target_vocabulary
      - query_terms
      title: VerifiedSynonymLookupRequest
      type: object
    VerifiedSynonymLookupResponse:
      additionalProperties: false
      properties:
        matches:
          items:
            $ref: '#/components/schemas/VerifiedSynonymMatch'
          title: Matches
          type: array
      required:
      - matches
      title: VerifiedSynonymLookupResponse
      type: object
    VerifiedSynonymMatch:
      additionalProperties: false
      description: 'One cache-lookup result. ``result`` is the active

        :class:`VerifiedSynonym` row for the term, or null when the term

        is novel (no human-approved mapping yet).'
      properties:
        query_term:
          title: Query Term
          type: string
        result:
          anyOf:
          - $ref: '#/components/schemas/VerifiedSynonym'
          - type: 'null'
      required:
      - query_term
      title: VerifiedSynonymMatch
      type: object
    VerifiedSynonymResponse:
      additionalProperties: false
      properties:
        verified_synonym:
          $ref: '#/components/schemas/VerifiedSynonym'
      required:
      - verified_synonym
      title: VerifiedSynonymResponse
      type: object
