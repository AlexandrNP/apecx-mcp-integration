  /verified_synonyms/:
    post:
      description: "Record a novel approved mapping. Called by the workflow's\n``verified_synonym_writeback``\
        \ step after ``ApprovalStep`` returns\nan APPROVED / APPROVED_WITH_MODIFICATIONS\
        \ decision.\n\nEnforces at most one active mapping per (source, query, target,\n\
        scope) tuple via the unique index. A second write for the same\ntuple raises\
        \ HTTP 409 \u2014 the caller is expected to either revoke\nthe existing row\
        \ first or treat its canonical_term as the\nalready-recorded answer."
      operationId: create_verified_synonym_verified_synonyms__post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVerifiedSynonymRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedSynonymResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Verified Synonym
      tags:
      - verified_synonyms
  /verified_synonyms/lookup:
    post:
      description: 'Batched cache lookup. Returns one match per input term, in

        the same order as ``body.query_terms``. ``result`` is ``null`` for

        terms with no active mapping under the requested (source, target,

        scope) tuple.'
      operationId: lookup_verified_synonyms_lookup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifiedSynonymLookupRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedSynonymLookupResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Lookup
      tags:
      - verified_synonyms
  /verified_synonyms/{synonym_id}:
    patch:
      description: "Soft-delete: set ``is_active=false``, record revocation metadata.\n\
        \nThe row is preserved for audit. ``superseded_by``, if set, points\nat the\
        \ replacement row that the caller already created \u2014 giving\nthe audit\
        \ trail a forward pointer for \"what did we change this\nto?\" questions.\n\
        \nRevoking a row that is already inactive is a 409 (idempotency is\nthe caller's\
        \ job; allowing double-revocation would overwrite the\noriginal revocation\
        \ metadata)."
      operationId: revoke_verified_synonym_verified_synonyms__synonym_id__patch
      parameters:
      - in: path
        name: synonym_id
        required: true
        schema:
          format: uuid
          title: Synonym Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeVerifiedSynonymRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedSynonymResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Revoke Verified Synonym
      tags:
      - verified_synonyms
